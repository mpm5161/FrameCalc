<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frame.io ROI &amp; Proposal Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            adobe: {
              blue: '#1473e6',
              dark: '#0d66d0',
              navy: '#1b1f2e',
            },
            frame: {
              teal: '#00b4d8',
            },
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Adobe Clean"', '"Segoe UI"', 'Roboto', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    /* ── Custom base styles ── */
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* Input ring on focus */
    .field-input:focus { outline: 2px solid #FA0F00; outline-offset: 0px; }
    .field-input { transition: border-color 0.15s ease; }

    /* Tooltip */
    .tooltip-wrap { position: relative; display: inline-flex; align-items: center; }
    .tooltip-wrap .tooltip-box {
      display: none; position: absolute; left: 50%; transform: translateX(-50%);
      bottom: calc(100% + 6px); background: #1b1f2e; color: #fff;
      font-size: 12px; line-height: 1.4; padding: 6px 10px; border-radius: 6px;
      white-space: nowrap; max-width: 240px; white-space: normal; width: max-content;
      max-width: 220px; z-index: 50; pointer-events: none;
    }
    .tooltip-wrap:hover .tooltip-box { display: block; }
    .tooltip-wrap .tooltip-box::after {
      content: ''; position: absolute; top: 100%; left: 50%;
      transform: translateX(-50%); border: 5px solid transparent;
      border-top-color: #1b1f2e;
    }

    /* Step indicator */
    .step-dot { transition: all 0.2s ease; }

    /* Break-even hero */
    .breakeven-num { font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 800; line-height: 1; }

    /* Scenario tab */
    .scenario-tab { transition: all 0.15s ease; }

    /* Collapsible */
    .collapsible-content { overflow: hidden; transition: max-height 0.3s ease; }

    /* Card hover */
    .metric-card { transition: box-shadow 0.15s ease; }

    /* ── Print styles ── */
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background: white !important; font-size: 12px; }
      .print-page { padding: 0 !important; max-width: 100% !important; }
      .print-break { page-break-before: always; }
      .metric-card { box-shadow: none !important; border: 1px solid #e0e0e0 !important; }
    }
    .print-only { display: none; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #c0c0c0; border-radius: 3px; }
  </style>
</head>
<body class="bg-[#f5f5f5] min-h-screen">
  <div id="root"></div>

  <!-- Load pricing configuration first (separate file for easy updating) -->
  <script src="pricing-config.js"></script>

  <!-- React 18 + Babel for JSX (inline = no CORS issue with file://) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    /* global PRICING_CONFIG, React, ReactDOM */
    const { useState, useMemo, useCallback, useRef, useEffect } = React;
    const PC = PRICING_CONFIG;

    // ═══════════════════════════════════════════════════════════════════
    //  UTILITIES
    // ═══════════════════════════════════════════════════════════════════
    const fmt = {
      currency: (n, compact = false) => {
        if (n == null || isNaN(n)) return '-';
        if (compact && Math.abs(n) >= 1000) {
          return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD',
            notation: 'compact', maximumFractionDigits: 1 }).format(n);
        }
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD',
          minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(n);
      },
      num: (n, dec = 0) => {
        if (n == null || isNaN(n)) return '-';
        return new Intl.NumberFormat('en-US', { minimumFractionDigits: dec,
          maximumFractionDigits: dec }).format(n);
      },
      pct: (n, dec = 0) => n == null || isNaN(n) ? '-' : `${fmt.num(n, dec)}%`,
      months: (n) => {
        if (n == null || isNaN(n)) return '-';
        if (n < 1) return `${Math.round(n * 30)} days`;
        return `${fmt.num(n, 1)} months`;
      },
      tb: (n) => n == null || isNaN(n) ? '-' : `${fmt.num(n, n < 10 ? 1 : 0)} TB`,
    };

    function clamp(v, min, max) { return Math.max(min, max == null ? v : Math.min(v, max)); }

    // ═══════════════════════════════════════════════════════════════════
    //  CALCULATION ENGINE
    // ═══════════════════════════════════════════════════════════════════
    function getPricePerSeat(planId, seatsCount, priceLevel, programId) {
      const plan = PC.plans[planId];
      if (!plan) return null;
      const pt = plan.pricing;
      if (pt.type === 'flat_per_seat') {
        return pt.perSeat[priceLevel] ?? pt.perSeat.target;
      }
      if (pt.type === 'volume_tiered') {
        if (programId === 'vipc' && pt.vipc) {
          return pt.vipc[priceLevel] ?? pt.vipc.target;
        }
        const tier = (pt.tiers || []).find(t =>
          seatsCount >= t.min && (t.max == null || seatsCount <= t.max));
        if (!tier) return null;
        return tier[priceLevel] ?? tier.target;
      }
      return null;
    }

    function getIncludedManagedTB(planId, seatsCount) {
      const plan = PC.plans[planId];
      if (!plan) return 0;
      const m = plan.storage.managed;
      if (m.type === 'seat_scaled' || m.type === 'sitewide') {
        return Math.min(m.tbPerUser * seatsCount, m.maxTB);
      }
      if (m.type === 'account_level') return m.tbTotal || 0;
      if (m.type === 'legacy_per_user_gb') return (m.gbPerUser / 1024) * seatsCount;
      return 0;
    }

    function calculate(s) {
      const errors = [];
      const warnings = [];
      const plan = PC.plans[s.plan] || null;
      const program = PC.buyingPrograms[s.buyingProgram] || null;

      // ── Step 1: Pricing ──────────────────────────────────────────────
      let seats = 0;
      let pricePerSeat = null;
      let baseSoftwareCost = 0;
      let totalSoftwareCost = 0;
      let addManagedCost = 0;
      let addMountedCost = 0;

      seats = parseInt(s.seats) || 0;
      if (plan && seats > 0) {
        const tablePricePerSeat = getPricePerSeat(s.plan, seats, s.priceLevel, s.buyingProgram);
        pricePerSeat = parseFloat(s.customPricePerSeat) > 0
          ? parseFloat(s.customPricePerSeat)
          : tablePricePerSeat;
        if (pricePerSeat != null) {
          baseSoftwareCost = pricePerSeat * seats;
        }
        if (seats < (plan.minSeats || 0)) {
          errors.push(`Minimum seat quantity for this plan is ${plan.minSeats}.`);
        }
      }

      // Table-calculated per-seat price (before any override), used for reference display
      const tablePricePerSeatRef = plan && seats > 0
        ? getPricePerSeat(s.plan, seats, s.priceLevel, s.buyingProgram)
        : null;

      // Add-ons
      const addManagedTB = parseFloat(s.additionalManagedTB) || 0;
      const addMountedBlocks = parseInt(s.additionalMountedBlocks) || 0;
      const managedAddon = PC.addons.managedStorage;
      const mountedAddon = PC.addons.mountedStorage;
      const priceKey = s.priceLevel || 'target';
      const tableManagedPrice = managedAddon.pricing[priceKey] ?? managedAddon.pricing.target;
      const effectiveManagedPrice = parseFloat(s.customManagedPrice) > 0
        ? parseFloat(s.customManagedPrice)
        : tableManagedPrice;
      const tableMountedPrice = mountedAddon.pricing[priceKey] ?? mountedAddon.pricing.target;
      const effectiveMountedPrice = parseFloat(s.customMountedPrice) > 0
        ? parseFloat(s.customMountedPrice)
        : tableMountedPrice;

      if (addManagedTB > 0 && plan) {
        addManagedCost = addManagedTB * effectiveManagedPrice;
      }
      if (addMountedBlocks > 0 && plan) {
        addMountedCost = addMountedBlocks * effectiveMountedPrice;
      }

      totalSoftwareCost = baseSoftwareCost + addManagedCost + addMountedCost;

      // Included storage
      const includedManagedTB = plan ? getIncludedManagedTB(s.plan, seats) : 0;
      const includedMountedTB = plan ? (plan.storage.mounted.includedTB + addMountedBlocks * 10) : 0;

      // Validation
      if (s.buyingProgram && s.plan && plan && !plan.buyingProgramIds.includes(s.buyingProgram)) {
        errors.push(`The "${plan.shortName}" plan is not available under ${program?.name || s.buyingProgram}.`);
      }

      // ── Step 2: Storage ──────────────────────────────────────────────
      const activeMediaTB = parseFloat(s.activeMediaTB) || 0;
      const growthPct = parseFloat(s.annualGrowthPct) || 0;
      const projectedMediaTB = activeMediaTB * (1 + growthPct / 100);
      const totalIncludedPlusPurchased = includedManagedTB + addManagedTB;
      const storageGapTB = Math.max(0, projectedMediaTB - totalIncludedPlusPurchased);
      const dupFactor = s.duplicationFactor && s.duplicationFactor !== '' && s.duplicationFactor !== 'unknown'
        ? parseFloat(s.duplicationFactor) : null;
      const currentStorageSpend = parseFloat(s.currentStorageSpend) || 0;

      // Recommended additional storage if gap exists (round up to nearest TB)
      const recommendedAddTB = storageGapTB > 0 ? Math.ceil(storageGapTB) : 0;
      const recommendedAddStorageCost = recommendedAddTB > 0
        ? recommendedAddTB * (managedAddon.pricing[priceKey] ?? managedAddon.pricing.target)
        : 0;

      // Total investment (software + any recommended additional storage)
      const totalInvestment = totalSoftwareCost;
      // Note: we surface additional storage cost separately

      // ── Step 3: ROI ──────────────────────────────────────────────────
      // participants: use entered value, else derive from seat count × preset ratio (default 2×)
      const participantsRatio = parseFloat(s.participantsRatio) || 2;
      const participants = parseInt(s.participants) > 0
        ? parseInt(s.participants)
        : (seats > 0 ? Math.round(seats * participantsRatio) : 0);
      const hourlyRate = parseFloat(s.hourlyLaborCost) || 0;
      const minutesSaved = parseFloat(s.minutesSavedPerWeek) || 0;
      const hardDollarSavings = parseFloat(s.currentSpendToReduce) || 0;
      const workingWeeks = PC.rules.workingWeeksPerYear;

      // Scenario multipliers
      const multipliers = { conservative: 0.5, expected: 1.0, 'high-impact': 1.5 };
      const mult = multipliers[s.activeScenario] || 1.0;
      const adjMinutesSaved = minutesSaved * mult;

      // Productive capacity recovered (not cash savings, clearly labeled)
      const productiveCapacityValue = participants > 0 && hourlyRate > 0 && adjMinutesSaved > 0
        ? participants * (adjMinutesSaved / 60) * hourlyRate * workingWeeks : 0;

      // Total quantified annual value
      const totalQuantifiedValue = productiveCapacityValue + hardDollarSavings;

      // Net annual value
      const netAnnualValue = totalQuantifiedValue - totalInvestment;

      // ROI %
      const roi = totalInvestment > 0 && totalQuantifiedValue > 0
        ? ((totalQuantifiedValue - totalInvestment) / totalInvestment) * 100 : null;

      // Payback (months)
      const paybackMonths = totalQuantifiedValue > 0 && totalInvestment > 0
        ? (totalInvestment / totalQuantifiedValue) * 12 : null;

      // ── Break-even ────────────────────────────────────────────────────
      const hardDollarsCoverInvestment = hardDollarSavings >= totalInvestment && totalInvestment > 0;
      const remainingToJustify = hardDollarsCoverInvestment ? 0 : Math.max(0, totalInvestment - hardDollarSavings);
      let breakEvenMinutes = null;
      if (!hardDollarsCoverInvestment && participants > 0 && hourlyRate > 0 && remainingToJustify > 0) {
        breakEvenMinutes = (remainingToJustify / participants / hourlyRate / workingWeeks) * 60;
      }

      // ── Capacity gap ──────────────────────────────────────────────────
      const contentGrowthPct = s.contentDemandGrowthPct !== '' ? parseFloat(s.contentDemandGrowthPct) : null;
      const headcountGrowthPct = s.headcountGrowthPct !== '' ? parseFloat(s.headcountGrowthPct) : null;
      const capacityGapPct = (contentGrowthPct != null && headcountGrowthPct != null)
        ? contentGrowthPct - headcountGrowthPct : null;

      // ── Optional review delay ─────────────────────────────────────────
      const annualProjects = parseFloat(s.annualProjects) || 0;
      const reviewRounds = parseFloat(s.reviewRoundsPerProject) || 0;
      const hoursDelayPerReview = parseFloat(s.hoursDelayPerReview) || 0;
      const reviewDelayHours = annualProjects * reviewRounds * hoursDelayPerReview;
      const reviewDelayValue = reviewDelayHours > 0 && hourlyRate > 0 ? reviewDelayHours * hourlyRate : 0;

      return {
        // Plan
        plan, program, seats, pricePerSeat,
        tablePricePerSeatRef,
        effectiveManagedPrice, tableManagedPrice, managedOverrideActive: parseFloat(s.customManagedPrice) > 0,
        effectiveMountedPrice, tableMountedPrice, mountedOverrideActive: parseFloat(s.customMountedPrice) > 0,
        priceOverrideActive: parseFloat(s.customPricePerSeat) > 0,
        // Costs
        baseSoftwareCost, addManagedCost, addMountedCost, totalSoftwareCost,
        includedManagedTB, includedMountedTB, addManagedTB,
        // Storage
        activeMediaTB, growthPct, projectedMediaTB, storageGapTB,
        recommendedAddTB, recommendedAddStorageCost,
        totalIncludedPlusPurchased, dupFactor, currentStorageSpend,
        // ROI
        totalInvestment, participants, hourlyRate, adjMinutesSaved,
        mult, productiveCapacityValue, hardDollarSavings,
        totalQuantifiedValue, netAnnualValue, roi, paybackMonths,
        breakEvenMinutes, remainingToJustify, hardDollarsCoverInvestment,
        // Capacity gap
        capacityGapPct, contentGrowthPct, headcountGrowthPct,
        // Review delay
        reviewDelayHours, reviewDelayValue,
        // Validation
        errors, warnings,
      };
    }

    // ═══════════════════════════════════════════════════════════════════
    //  SMALL SHARED COMPONENTS
    // ═══════════════════════════════════════════════════════════════════
    function Tooltip({ text, children }) {
      return (
        <span className="tooltip-wrap cursor-help">
          {children}
          <span className="tooltip-box">{text}</span>
        </span>
      );
    }

    function InfoIcon() {
      return (
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" className="text-gray-400 ml-1">
          <circle cx="8" cy="8" r="7.25" stroke="currentColor" strokeWidth="1.5"/>
          <path d="M8 7v5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
          <circle cx="8" cy="4.5" r="0.75" fill="currentColor"/>
        </svg>
      );
    }

    function Label({ children, htmlFor, tip }) {
      return (
        <label htmlFor={htmlFor} className="block text-sm font-medium text-gray-700 mb-1 flex items-center">
          {children}
          {tip && <Tooltip text={tip}><InfoIcon/></Tooltip>}
        </label>
      );
    }

    function FieldHelp({ children }) {
      return <p className="mt-1 text-xs text-gray-500">{children}</p>;
    }

    function FieldError({ msg }) {
      if (!msg) return null;
      return <p className="mt-1 text-xs text-red-600 flex items-center gap-1">⚠ {msg}</p>;
    }

    function Input({ id, type = 'text', value, onChange, prefix, suffix, placeholder, min, max, step, className = '', disabled }) {
      return (
        <div className="relative flex items-center">
          {prefix && <span className="absolute left-3 text-gray-500 text-sm select-none">{prefix}</span>}
          <input
            id={id}
            type={type}
            value={value}
            onChange={e => onChange(e.target.value)}
            placeholder={placeholder}
            min={min}
            max={max}
            step={step}
            disabled={disabled}
            className={`field-input w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white
              ${prefix ? 'pl-7' : ''} ${suffix ? 'pr-10' : ''} ${disabled ? 'bg-gray-50 text-gray-400 cursor-not-allowed' : ''}
              ${className}`}
          />
          {suffix && <span className="absolute right-3 text-gray-500 text-sm select-none">{suffix}</span>}
        </div>
      );
    }

    function Select({ id, value, onChange, options, placeholder = 'Select…', disabled }) {
      return (
        <select
          id={id}
          value={value}
          onChange={e => onChange(e.target.value)}
          disabled={disabled}
          className={`field-input w-full border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white appearance-none
            ${disabled ? 'bg-gray-50 text-gray-400 cursor-not-allowed' : ''}`}
        >
          <option value="">{placeholder}</option>
          {options.map(o => (
            <option key={o.value} value={o.value} disabled={o.disabled}>{o.label}</option>
          ))}
        </select>
      );
    }

    function Card({ children, className = '', emphasis }) {
      return (
        <div className={`bg-white rounded-xl border ${emphasis ? 'border-gray-300 shadow-md' : 'border-gray-200 shadow-sm'} p-5 ${className}`}>
          {children}
        </div>
      );
    }

    function SectionTitle({ children }) {
      return <h3 className="text-base font-semibold text-gray-900 mb-4">{children}</h3>;
    }

    function MetricCard({ label, value, sub, color = 'blue', small, tip }) {
      const colors = {
        blue:   'bg-gray-100 border-gray-200 text-gray-800',
        green:  'bg-emerald-50 border-emerald-100 text-emerald-900',
        amber:  'bg-amber-50 border-amber-100 text-amber-900',
        gray:   'bg-gray-50 border-gray-100 text-gray-700',
        purple: 'bg-purple-50 border-purple-100 text-purple-900',
        red:    'bg-red-50 border-red-100 text-red-900',
      };
      return (
        <div className={`metric-card rounded-xl border p-4 ${colors[color]}`}>
          <div className="flex items-start justify-between">
            <span className={`${small ? 'text-xs' : 'text-xs'} font-medium opacity-70 uppercase tracking-wide leading-tight`}>
              {label}
            </span>
            {tip && <Tooltip text={tip}><InfoIcon /></Tooltip>}
          </div>
          <div className={`${small ? 'text-xl' : 'text-2xl'} font-bold mt-1 leading-tight`}>{value}</div>
          {sub && <div className="text-xs opacity-60 mt-0.5">{sub}</div>}
        </div>
      );
    }

    function Alert({ type = 'warning', children }) {
      const styles = {
        warning: 'bg-amber-50 border-amber-200 text-amber-800',
        error: 'bg-red-50 border-red-200 text-red-800',
        info: 'bg-gray-50 border-gray-200 text-gray-700',
        success: 'bg-emerald-50 border-emerald-200 text-emerald-800',
      };
      return (
        <div className={`border rounded-lg px-4 py-3 text-sm ${styles[type]}`}>{children}</div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════
    //  HEADER
    // ═══════════════════════════════════════════════════════════════════
    function Header() {
      return (
        <header className="no-print bg-[#1c1c1c] text-white shadow-lg">
          <div className="max-w-screen-xl mx-auto px-4 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="flex items-center gap-2.5">
                <div className="w-7 h-7 bg-[#FA0F00] rounded flex items-center justify-center">
                  <svg viewBox="0 0 20 20" fill="white" width="16" height="16">
                    <rect x="2" y="2" width="7" height="7" rx="1"/>
                    <rect x="11" y="2" width="7" height="7" rx="1"/>
                    <rect x="2" y="11" width="7" height="7" rx="1"/>
                    <rect x="11" y="11" width="7" height="7" rx="1"/>
                  </svg>
                </div>
                <span className="font-bold text-white text-lg tracking-tight">Frame.io</span>
                <span className="text-gray-500 text-lg font-light hidden sm:block">|</span>
                <span className="text-gray-300 text-sm hidden sm:block">ROI &amp; Proposal Builder</span>
              </div>
            </div>
            <div className="text-xs text-gray-500 hidden md:block">
              Internal Sales Tool &nbsp;·&nbsp; Adobe Confidential
            </div>
          </div>
        </header>
      );
    }

    // ═══════════════════════════════════════════════════════════════════
    //  STEP PROGRESS
    // ═══════════════════════════════════════════════════════════════════
    function StepProgress({ current, onGo }) {
      const steps = [
        { id: 0, label: 'Customer & Program' },
        { id: 1, label: 'Storage' },
        { id: 2, label: 'Workflow & ROI' },
        { id: 3, label: 'Proposal' },
      ];
      return (
        <div className="no-print bg-white border-b border-gray-200 shadow-sm">
          <div className="max-w-screen-xl mx-auto px-4">
            <div className="flex items-center gap-0">
              {steps.map((step, i) => (
                <React.Fragment key={step.id}>
                  <button
                    onClick={() => onGo(step.id)}
                    className={`flex items-center gap-2 py-4 px-3 text-sm font-medium transition-colors border-b-2 cursor-pointer
                      ${current === step.id
                        ? 'border-[#FA0F00] text-[#FA0F00]'
                        : step.id < current
                          ? 'border-transparent text-gray-600 hover:text-gray-900'
                          : 'border-transparent text-gray-400 cursor-default'}`}
                    disabled={step.id > current}
                  >
                    <span className={`step-dot w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold
                      ${current === step.id ? 'bg-[#FA0F00] text-white' :
                        step.id < current ? 'bg-emerald-500 text-white' : 'bg-gray-200 text-gray-500'}`}>
                      {step.id < current ? '✓' : step.id + 1}
                    </span>
                    <span className="hidden sm:block">{step.label}</span>
                  </button>
                  {i < steps.length - 1 && (
                    <div className={`flex-1 h-px mx-1 ${step.id < current ? 'bg-emerald-300' : 'bg-gray-200'}`} />
                  )}
                </React.Fragment>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════
    //  HOW TO USE
    // ═══════════════════════════════════════════════════════════════════
    function HowToUse() {
      const [open, setOpen] = React.useState(true);
      const steps = [
        { n: '1', title: 'Customer & Program', desc: 'Enter the account name, select a buying program (ETLA, VIP Custom, or Frame Paper), choose a plan, set seat count, and configure price level. Custom negotiated pricing can be entered inline.' },
        { n: '2', title: 'Storage', desc: 'Enter current active media volume if known. Add managed or mounted storage blocks as needed. The tool calculates what is included and flags any gap.' },
        { n: '3', title: 'Workflow & ROI', desc: 'Pick an industry preset to pre-fill labor assumptions instantly, or enter your own. Use the discovery questions to guide the customer conversation and validate inputs.' },
        { n: '4', title: 'Proposal', desc: 'Review the complete business case. Adjust scenario (Conservative, Expected, High-Impact) in the sidebar. Print to PDF or screenshot the summary for the customer.' },
      ];
      return (
        <div className="rounded-xl overflow-hidden border border-gray-200 bg-white">
          <button type="button" onClick={() => setOpen(o => !o)}
            className="w-full flex items-center justify-between px-5 py-3 bg-[#1c1c1c] text-left">
            <div className="flex items-center gap-2">
              <svg width="14" height="14" viewBox="0 0 20 20" fill="white" opacity="0.7"><circle cx="10" cy="10" r="9" stroke="white" strokeWidth="1.5" fill="none"/><text x="10" y="14.5" textAnchor="middle" fontSize="11" fill="white" fontWeight="bold">i</text></svg>
              <span className="text-white font-semibold text-sm">How to use this calculator</span>
            </div>
            <span className="text-gray-400 text-xs">{open ? 'Collapse' : 'Expand'}</span>
          </button>
          {open && (
            <div className="px-5 py-4 space-y-4">
              <p className="text-xs text-gray-500 leading-relaxed">
                This tool builds a Frame.io business case for a specific account. Work through four steps in order. The sidebar updates live as you enter data. All fields with a <span className="text-red-500 font-bold">*</span> are required to generate the proposal; everything else is optional context.
              </p>
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                {steps.map(step => (
                  <div key={step.n} className="bg-gray-50 rounded-xl p-3">
                    <div className="flex items-center gap-2 mb-2">
                      <span className="bg-[#FA0F00] text-white text-[11px] font-black w-5 h-5 rounded flex items-center justify-center shrink-0">{step.n}</span>
                      <span className="font-bold text-gray-900 text-xs">{step.title}</span>
                    </div>
                    <p className="text-xs text-gray-500 leading-relaxed">{step.desc}</p>
                  </div>
                ))}
              </div>
              <div className="flex flex-wrap gap-x-5 gap-y-1 text-xs text-gray-500 border-t border-gray-100 pt-3">
                <span><span className="font-semibold text-gray-700">Tip:</span> Industry presets in Step 3 fill all labor assumptions in one click.</span>
                <span><span className="font-semibold text-gray-700">Tip:</span> Negotiated pricing overrides appear inline below each pricing field.</span>
                <span><span className="font-semibold text-gray-700">Tip:</span> Hard-dollar savings are optional but strengthen the break-even story.</span>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════
    //  STEP 1, CUSTOMER & BUYING PROGRAM
    // ═══════════════════════════════════════════════════════════════════
    function Step1({ s, u, calc }) {
      const programOptions = Object.values(PC.buyingPrograms).map(p => ({
        value: p.id, label: p.name,
        ...(p.requiresApproval ? { label: `${p.name} ⚠` } : {}),
      }));

      const availablePlans = s.buyingProgram
        ? (PC.buyingPrograms[s.buyingProgram]?.availablePlanIds || []).map(id => PC.plans[id])
        : [];

      function getPlanFeatureSummary(p) {
        const items = [];
        items.push({ text: p.storage.managed.label, plus: null });
        if (p.features.sbwm === 'included') items.push({ text: 'Session watermarking', plus: true });
        else if (p.features.sbwm === 'requires_combined_sku') items.push({ text: 'SBWM requires combined SKU', plus: false });
        else if (p.features.sbwm === 'legacy_addon') items.push({ text: 'Watermarking: legacy add-on only', plus: false });
        if (p.features.forensicWatermarking && p.features.drm && p.features.storageConnect && p.features.secureSharing) {
          items.push({ text: 'Forensic WM, DRM, Storage Connect, secure sharing', plus: true });
        } else {
          if (p.features.forensicWatermarking) items.push({ text: 'Forensic watermarking', plus: true });
          if (p.features.storageConnect) items.push({ text: 'Storage Connect', plus: true });
          if (p.features.secureSharing) items.push({ text: 'Secure sharing', plus: true });
          if (p.features.drm) items.push({ text: 'DRM protection', plus: true });
        }
        if (!p.adminConsole) items.push({ text: 'No Adobe Admin Console', plus: false });
        return items;
      }

      const priceLevelOptions = [
        { value: 'target', label: 'Target (recommended)' },
        { value: 'list',   label: 'List price' },
        { value: 'floor',  label: 'Floor price' },
      ];

      const plan = PC.plans[s.plan];
      const priceKey = s.priceLevel || 'target';

      // Display managed storage add-on pricing
      const managedAddonPrice = PC.addons.managedStorage.pricing[priceKey];
      const mountedAddonPrice = PC.addons.mountedStorage.pricing[priceKey];

      return (
        <div className="space-y-5">
          <HowToUse />
          <Card>
            <SectionTitle>Customer Information</SectionTitle>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <Label htmlFor="cname">Company / Account Name <span className="text-red-500">*</span></Label>
                <Input id="cname" value={s.customerName} onChange={v => u('customerName', v)}
                  placeholder="Acme Corp" />
              </div>
              <div>
                <Label htmlFor="oname">Opportunity Name <span className="text-gray-400">(optional)</span></Label>
                <Input id="oname" value={s.opportunityName} onChange={v => u('opportunityName', v)}
                  placeholder="Frame.io Expansion FY26" />
              </div>
            </div>
          </Card>

          <Card>
            <SectionTitle>Buying Program &amp; Plan</SectionTitle>
            {/* Buying Program */}
            <div className="mb-4 sm:max-w-xs">
              <Label htmlFor="prog" tip="ETLA is a 3-year commitment. VIP Custom is 1–3 years. Frame Paper is legacy/exception-only.">
                Buying Program <span className="text-red-500">*</span>
              </Label>
              <Select id="prog" value={s.buyingProgram}
                onChange={v => { u('buyingProgram', v); u('plan', ''); }}
                options={programOptions} />
              {s.buyingProgram && PC.buyingPrograms[s.buyingProgram]?.notes?.length > 0 && (
                <FieldHelp>{PC.buyingPrograms[s.buyingProgram].notes[0]}</FieldHelp>
              )}
            </div>

            {/* Plan selection: button cards */}
            <div className="mb-4">
              <Label tip="Select includes 2 TB/user managed storage. Prime includes 3 TB/user and all enterprise security features.">
                Frame Plan <span className="text-red-500">*</span>
              </Label>
              {!s.buyingProgram ? (
                <p className="text-sm text-gray-400 mt-1.5 italic">Choose a buying program above to see available plans.</p>
              ) : (
                <div className={`grid gap-2 mt-1.5 ${availablePlans.length <= 2 ? 'grid-cols-1 sm:grid-cols-2' : 'grid-cols-1 sm:grid-cols-3'}`}>
                  {availablePlans.map(p => {
                    const selected = s.plan === p.id;
                    const features = getPlanFeatureSummary(p);
                    return (
                      <button key={p.id} type="button" onClick={() => u('plan', p.id)}
                        className={`text-left rounded-xl border-2 p-3 transition-all focus:outline-none
                          ${selected
                            ? 'border-[#FA0F00] bg-red-50 shadow-sm'
                            : 'border-gray-200 bg-white hover:border-gray-300 hover:shadow-sm'}`}>
                        <div className="flex items-start justify-between mb-2">
                          <span className={`font-bold text-sm leading-tight ${selected ? 'text-[#FA0F00]' : 'text-gray-900'}`}>
                            {p.shortName}
                          </span>
                          {selected && (
                            <span className="bg-[#FA0F00] text-white text-[9px] font-bold px-1.5 py-0.5 rounded ml-1 shrink-0 leading-tight">
                              SELECTED
                            </span>
                          )}
                        </div>
                        <div className="space-y-0.5">
                          {features.map((f, i) => (
                            <div key={i} className={`flex items-start gap-1 text-xs leading-tight
                              ${i === 0
                                ? 'text-gray-600 font-medium'
                                : f.plus === true
                                  ? (selected ? 'text-emerald-700' : 'text-emerald-600')
                                  : 'text-gray-400'}`}>
                              <span className="shrink-0 mt-px">{i === 0 ? '·' : f.plus === true ? '+' : '·'}</span>
                              <span>{f.text}</span>
                            </div>
                          ))}
                        </div>
                      </button>
                    );
                  })}
                </div>
              )}
            </div>

            {/* Standard seat count */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
              <div>
                <Label htmlFor="seats" tip="Minimum 10 seats required. All Frame licenses are seat-based.">
                  Number of Seats <span className="text-red-500">*</span>
                </Label>
                <Input id="seats" type="number" value={s.seats}
                  onChange={v => u('seats', v)} placeholder="10" min="10" step="1" />
                <FieldHelp>Minimum 10 seats.</FieldHelp>
              </div>
              <div>
                <Label htmlFor="plvl" tip="Target is the recommended starting price. Use List only if needed for comparison.">
                  Price Level
                </Label>
                <Select id="plvl" value={s.priceLevel} onChange={v => u('priceLevel', v)}
                  options={priceLevelOptions} />
              </div>
            </div>

            {/* Per-seat negotiated price, ETLA and VIP Custom only */}
            {plan && calc.seats >= 10 && ['etla', 'vipc'].includes(s.buyingProgram) && (
              <div className="mt-4 pt-4 border-t border-gray-100">
                <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">
                  Negotiated Per-Seat Price <span className="font-normal text-gray-400 normal-case">(optional; overrides table price)</span>
                </p>
                <Label htmlFor="custPps" tip="Enter a negotiated per-seat price to override the standard table pricing. Leave blank to use the calculated price.">
                  Per-Seat Price Override
                </Label>
                {calc.tablePricePerSeatRef != null && (() => {
                  const tiers = plan.pricing?.tiers;
                  const seatsN = calc.seats;
                  const tier = tiers?.find(t => seatsN >= t.min && (t.max == null || seatsN <= t.max));
                  const pricingRef = tier || plan.pricing?.perSeat;
                  return pricingRef ? (
                    <div className="text-xs text-gray-500 mb-1.5 flex gap-3">
                      <span>List: <strong>{fmt.currency(pricingRef.list)}</strong></span>
                      <span>Target: <strong>{fmt.currency(pricingRef.target)}</strong></span>
                      {pricingRef.floor && <span>Floor: <strong>{fmt.currency(pricingRef.floor)}</strong></span>}
                    </div>
                  ) : null;
                })()}
                <Input id="custPps" type="number" value={s.customPricePerSeat}
                  onChange={v => u('customPricePerSeat', v)} prefix="$" suffix="/seat/yr"
                  placeholder={calc.tablePricePerSeatRef != null ? String(Math.round(calc.tablePricePerSeatRef)) : 'table price'} />
                {calc.priceOverrideActive && (
                  <div className="mt-1 flex items-center gap-2">
                    <span className="text-xs text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded">
                      Override active, table price was {fmt.currency(calc.tablePricePerSeatRef)}
                    </span>
                    <button onClick={() => u('customPricePerSeat', '')}
                      className="text-xs text-gray-400 hover:text-gray-600 underline">reset</button>
                  </div>
                )}
              </div>
            )}

          {/* Validation alerts */}
            {calc.errors.length > 0 && calc.errors.map((e, i) => (
              <Alert key={i} type="error">{e}</Alert>
            ))}
            {calc.warnings.length > 0 && calc.warnings.map((w, i) => (
              <Alert key={i} type="warning">{w}</Alert>
            ))}
          </Card>

          {/* Add-ons */}
          {plan && (
            <Card>
              <SectionTitle>Storage Add-ons <span className="text-gray-400 font-normal text-sm">(optional)</span></SectionTitle>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <Label htmlFor="addMgd"
                    tip={`Additional managed storage. Included: ${fmt.tb(calc.includedManagedTB)} from your plan.`}>
                    Additional Managed Storage (TB)
                  </Label>
                  <Input id="addMgd" type="number" value={s.additionalManagedTB}
                    onChange={v => u('additionalManagedTB', v)} suffix="TB" placeholder="0" min="0" step="1" />
                  <FieldHelp>
                    {calc.managedOverrideActive
                      ? <span>{fmt.currency(calc.effectiveManagedPrice)}/TB/year <span className="text-amber-600">(negotiated)</span> · Included: {fmt.tb(calc.includedManagedTB)}</span>
                      : `${fmt.currency(managedAddonPrice)}/TB/year · Included: ${fmt.tb(calc.includedManagedTB)}`}
                  </FieldHelp>
                  {parseFloat(s.additionalManagedTB) > 0 && ['etla', 'vipc'].includes(s.buyingProgram) && (
                    <div className="mt-2 pt-2 border-t border-gray-100">
                      <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">
                        Negotiated Price <span className="font-normal normal-case text-gray-400">(per TB, optional)</span>
                      </p>
                      <div className="text-xs text-gray-500 mb-1.5 flex gap-3">
                        <span>List: <strong>$720</strong></span>
                        <span>Target: <strong>$540</strong></span>
                        <span>Floor: <strong>$432</strong></span>
                      </div>
                      <Input id="custMgd" type="number" value={s.customManagedPrice}
                        onChange={v => u('customManagedPrice', v)} prefix="$" suffix="/TB/yr"
                        placeholder={String(calc.tableManagedPrice)} />
                      {calc.managedOverrideActive && (
                        <div className="mt-1 flex items-center gap-2">
                          <span className="text-xs text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded">
                            Override active, table was {fmt.currency(calc.tableManagedPrice)}
                          </span>
                          <button onClick={() => u('customManagedPrice', '')}
                            className="text-xs text-gray-400 hover:text-gray-600 underline">reset</button>
                        </div>
                      )}
                    </div>
                  )}
                </div>
                <div>
                  <Label htmlFor="addMnt"
                    tip={`Mounted storage lets users access Frame.io as a local drive. ${fmt.currency(mountedAddonPrice)}/10TB block/year. 2TB included per account.`}>
                    Additional Mounted Storage (10TB blocks)
                  </Label>
                  <Input id="addMnt" type="number" value={s.additionalMountedBlocks}
                    onChange={v => u('additionalMountedBlocks', v)} placeholder="0" min="0" step="1" />
                  <FieldHelp>
                    {calc.mountedOverrideActive
                      ? <span>{fmt.currency(calc.effectiveMountedPrice)}/10TB block/year <span className="text-amber-600">(negotiated)</span> · Included: 2 TB per account</span>
                      : `${fmt.currency(mountedAddonPrice)}/10TB block/year · Included: 2 TB per account`}
                  </FieldHelp>
                  {parseInt(s.additionalMountedBlocks) > 0 && ['etla', 'vipc'].includes(s.buyingProgram) && (
                    <div className="mt-2 pt-2 border-t border-gray-100">
                      <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">
                        Negotiated Price <span className="font-normal normal-case text-gray-400">(per 10 TB block, optional)</span>
                      </p>
                      <div className="text-xs text-gray-500 mb-1.5 flex gap-3">
                        <span>List: <strong>$9,600</strong></span>
                        <span>Target: <strong>$7,680</strong></span>
                        <span>Floor: <strong>$7,296</strong></span>
                      </div>
                      <Input id="custMnt" type="number" value={s.customMountedPrice}
                        onChange={v => u('customMountedPrice', v)} prefix="$" suffix="/10TB"
                        placeholder={String(calc.tableMountedPrice)} />
                      {calc.mountedOverrideActive && (
                        <div className="mt-1 flex items-center gap-2">
                          <span className="text-xs text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded">
                            Override active, table was {fmt.currency(calc.tableMountedPrice)}
                          </span>
                          <button onClick={() => u('customMountedPrice', '')}
                            className="text-xs text-gray-400 hover:text-gray-600 underline">reset</button>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </Card>
          )}

          {/* Plan feature summary */}
          {plan && (
            <Card>
              <SectionTitle>Plan Summary</SectionTitle>
              <div className="space-y-2">
                {plan.notes.map((n, i) => (
                  <div key={i} className="flex items-start gap-2 text-sm text-gray-700">
                    <span className="text-gray-400 mt-0.5 shrink-0">ℹ</span>
                    <span>{n}</span>
                  </div>
                ))}
              </div>
              {plan.features.sbwm === 'requires_combined_sku' && (
                <Alert type="info" className="mt-3">
                  To add Session-Based Watermarking, use the "Select with SBWM" plan instead.
                </Alert>
              )}
            </Card>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════
    //  STEP 2, STORAGE / MEDIA REQUIREMENTS
    // ═══════════════════════════════════════════════════════════════════
    function Step2({ s, u, calc }) {
      const dupOptions = [
        { value: '', label: 'Not sure / skip' },
        { value: '1', label: '1× (no duplication)' },
        { value: '1.5', label: '1.5× (some working copies)' },
        { value: '2', label: '2× (common proxy/working copy pattern)' },
        { value: '3', label: '3× (high duplication)' },
        { value: '4', label: '4× (very high duplication)' },
        { value: 'unknown', label: 'Unknown' },
      ];

      return (
        <div className="space-y-5">
          <Card>
            <SectionTitle>Media &amp; Storage Profile</SectionTitle>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <Label htmlFor="media" tip="Total active working media the team manages (not archive): video, image, audio, project files.">
                  Current Active Media Volume
                </Label>
                <Input id="media" type="number" value={s.activeMediaTB}
                  onChange={v => u('activeMediaTB', v)} suffix="TB" placeholder="e.g. 25" min="0" step="0.5" />
                <FieldHelp>Active / working media only. Do not include archival or cold storage.</FieldHelp>
              </div>
              <div>
                <Label htmlFor="growth" tip="How fast is the active media volume growing year over year?">
                  Estimated Annual Media Growth
                </Label>
                <Input id="growth" type="number" value={s.annualGrowthPct}
                  onChange={v => u('annualGrowthPct', v)} suffix="%" placeholder="e.g. 20" min="0" max="200" />
              </div>
              <div>
                <Label htmlFor="sspend" tip="Annual spend on storage, cloud transfer fees, NAS hardware, proxy generation services, or tools that could be reduced.">
                  Current Annual Storage / Infrastructure Spend <span className="text-gray-400">(optional)</span>
                </Label>
                <Input id="sspend" type="number" value={s.currentStorageSpend}
                  onChange={v => u('currentStorageSpend', v)} prefix="$" placeholder="0" min="0" />
                <FieldHelp>Include only spend realistically reducible with Frame.</FieldHelp>
              </div>
              <div>
                <Label htmlFor="dup"
                  tip="If the team maintains working copies, proxies, or local duplicates, the effective storage footprint is larger than the source files. This is context, not an automatic savings claim.">
                  Estimated Duplication Factor <span className="text-gray-400">(optional)</span>
                </Label>
                <Select id="dup" value={s.duplicationFactor}
                  onChange={v => u('duplicationFactor', v)} options={dupOptions} />
                <FieldHelp>Used as context; not assumed to be eliminable.</FieldHelp>
              </div>
            </div>
          </Card>

          {/* Storage analysis */}
          {calc.activeMediaTB > 0 && calc.plan && (
            <Card emphasis>
              <SectionTitle>Storage Analysis</SectionTitle>
              <div className="grid grid-cols-2 gap-3 mb-4">
                <MetricCard label="Current Active Media" value={fmt.tb(calc.activeMediaTB)} color="gray" small />
                <MetricCard label="Projected (12 months)" value={fmt.tb(calc.projectedMediaTB)}
                  sub={calc.growthPct > 0 ? `+${calc.growthPct}% growth` : 'No growth entered'} color="blue" small />
                <MetricCard label="Included Managed Storage" value={fmt.tb(calc.includedManagedTB)}
                  sub={calc.plan?.storage.managed.label} color="green" small />
                <MetricCard
                  label={calc.storageGapTB > 0 ? 'Shortfall (need more storage)' : 'Storage Headroom'}
                  value={calc.storageGapTB > 0 ? fmt.tb(calc.storageGapTB) : fmt.tb(calc.totalIncludedPlusPurchased - calc.projectedMediaTB)}
                  color={calc.storageGapTB > 0 ? 'amber' : 'green'} small />
              </div>

              {calc.storageGapTB > 0 && (
                <Alert type="warning">
                  <strong>Storage gap detected.</strong> The selected plan includes {fmt.tb(calc.includedManagedTB)} managed storage,
                  but your projected 12-month media volume is {fmt.tb(calc.projectedMediaTB)}.
                  Adding approximately <strong>{fmt.tb(calc.recommendedAddTB)}</strong> of managed storage
                  would cover the gap, estimated cost at {fmt.currency(PC.addons.managedStorage.pricing[s.priceLevel] ?? PC.addons.managedStorage.pricing.target)}/TB:
                  {' '}<strong>{fmt.currency(calc.recommendedAddStorageCost)}/year</strong>.
                  <br />
                  <span className="text-xs mt-1 block opacity-80">You can add this in Step 1 under "Additional Managed Storage."</span>
                </Alert>
              )}

              {calc.dupFactor != null && (
                <div className="mt-3 bg-gray-50 rounded-lg p-3 text-sm text-gray-700">
                  <strong>Duplication context:</strong> At {calc.dupFactor}× duplication, the team's total storage footprint
                  may be ~{fmt.tb(calc.activeMediaTB * calc.dupFactor)} across all copies.
                  Frame's mounted storage model (files stream on-demand from a single cloud source)
                  can reduce the need for redundant local copies and proxies. The degree of reduction
                  depends on workflow, and no specific reduction is assumed here.
                </div>
              )}

              {calc.currentStorageSpend > 0 && (
                <div className="mt-3 bg-gray-50 rounded-lg p-3 text-sm text-gray-700">
                  Current storage/infrastructure spend of <strong>{fmt.currency(calc.currentStorageSpend)}/year</strong> is
                  noted. Enter any portion realistically reducible by Frame in Step 3 under "Hard-Dollar Savings."
                </div>
              )}

              <div className="mt-3 text-xs text-gray-500">
                Mounted storage (2 TB included per account; additional 10 TB blocks available) streams media on demand,
                eliminating the need to sync or download before editing. This may reduce local storage requirements
                and manual transfer overhead, but actual reduction depends on your team's workflow.
              </div>
            </Card>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════
    //  STEP 3, WORKFLOW / ROI DISCOVERY
    // ═══════════════════════════════════════════════════════════════════
    function Step3({ s, u, calc }) {
      const PRESETS = {
        media:  { label: 'Media & Entertainment', desc: 'Studios, broadcasters, OTT', hourlyLaborCost: '85',  minutesSavedPerWeek: '45', participantsRatio: '2.5' },
        brand:  { label: 'Brand / In-House',       desc: 'Corporate creative, marketing',  hourlyLaborCost: '75',  minutesSavedPerWeek: '35', participantsRatio: '2'   },
        agency: { label: 'Agency / Production',    desc: 'Creative agencies, prod. co.',   hourlyLaborCost: '95',  minutesSavedPerWeek: '40', participantsRatio: '1.5' },
        post:   { label: 'Post / VFX',             desc: 'Post houses, VFX, finishing',    hourlyLaborCost: '110', minutesSavedPerWeek: '50', participantsRatio: '1.5' },
      };

      function applyPreset(key) {
        const p = PRESETS[key];
        u('hourlyLaborCost', p.hourlyLaborCost);
        u('minutesSavedPerWeek', p.minutesSavedPerWeek);
        u('participantsRatio', p.participantsRatio);
        u('participants', '');
        u('activePreset', key);
      }

      const ratio = parseFloat(s.participantsRatio) || 2;
      const derivedParticipants = calc.seats > 0 ? Math.round(calc.seats * ratio) : 0;

      const frictionExamples = [
        'uploading or downloading large media files',
        'moving files between tools or people',
        'finding the correct version of an asset',
        'creating, converting, or managing proxy files',
        'chasing approvals via email, Slack, or meetings',
        'reconciling feedback from multiple sources',
        'waiting for media transfers to complete',
        'sharing files securely with external reviewers',
      ];

      return (
        <div className="space-y-5">
          <Card>
            <SectionTitle>Team &amp; Labor</SectionTitle>

            {/* Industry preset picker */}
            <div className="mb-5 pb-4 border-b border-gray-100">
              <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">
                Quick-fill by industry
                <span className="ml-2 font-normal normal-case text-gray-400">— pre-loads typical rate, minutes saved, and team ratio</span>
              </p>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                {Object.entries(PRESETS).map(([key, preset]) => {
                  const active = s.activePreset === key;
                  return (
                    <button key={key} type="button" onClick={() => applyPreset(key)}
                      className={`text-left rounded-xl border-2 px-3 py-2.5 transition-all
                        ${active ? 'border-[#FA0F00] bg-red-50' : 'border-gray-200 bg-white hover:border-gray-300 hover:shadow-sm'}`}>
                      <p className={`font-bold text-xs leading-tight ${active ? 'text-[#FA0F00]' : 'text-gray-900'}`}>{preset.label}</p>
                      <p className="text-[10px] text-gray-500 mt-0.5 leading-tight">{preset.desc}</p>
                      <p className={`text-[10px] mt-1 font-medium leading-tight ${active ? 'text-[#FA0F00]' : 'text-gray-400'}`}>
                        ${preset.hourlyLaborCost}/hr · {preset.minutesSavedPerWeek} min/wk · {preset.participantsRatio}× seats
                      </p>
                    </button>
                  );
                })}
              </div>
              {s.activePreset && (
                <button type="button"
                  onClick={() => { u('activePreset', ''); u('participantsRatio', '2'); }}
                  className="mt-2 text-xs text-gray-400 hover:text-gray-600 underline">
                  Clear preset
                </button>
              )}
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">

                  {s.participants

              </div>
              <div>
                <Label htmlFor="rate"
                  tip="Fully loaded hourly cost including salary, benefits, and overhead. Used to calculate the dollar value of time saved.">
                  Avg. Fully Loaded Hourly Cost <span className="text-red-500">*</span>
                </Label>
                <Input id="rate" type="number" value={s.hourlyLaborCost}
                  onChange={v => u('hourlyLaborCost', v)} prefix="$" placeholder="75" min="1" />
                <FieldHelp>Blended fully-loaded rate across participants. Default: $75/hr.</FieldHelp>

              <div>
                <Label htmlFor="mins"
                  tip="Be conservative. This is the number that drives break-even: the tool will show how many minutes are actually needed for the investment to pay for itself.">
                  Est. Minutes Saved / Person / Week <span className="text-red-500">*</span>
                </Label>
                <Input id="mins" type="number" value={s.minutesSavedPerWeek}
                  onChange={v => u('minutesSavedPerWeek', v)} suffix="min/wk" placeholder="30" min="0" max="480" />
                <div className="mt-2 bg-gray-50 rounded-lg p-3 text-xs text-gray-600 space-y-1">
                  <p className="font-medium text-gray-700 mb-1">Examples of workflow friction to quantify:</p>

              </div>

          </Card>

          <Card>
            <SectionTitle>Discovery Questions</SectionTitle>
            <p className="text-xs text-gray-500 mb-4 -mt-1">Use these during the customer conversation to surface the assumptions that drive the model.</p>
            <div className="space-y-3">
              {[
                { q: 'How many people outside your core creative team have to approve something before it ships?', why: 'Sizes participating users beyond just seat holders.' },
                { q: 'What is the single biggest time sink in your review process right now?', why: 'Surfaces the friction that drives minutes saved.' },
                { q: 'Are you paying for separate tools just to move or share large media files with clients or vendors?', why: 'Opens hard-dollar savings: storage, transfer fees, redundant tools.' },
                { q: 'How often do revision cycles cause you to miss a deadline, and what does that typically cost?', why: 'Quantifies urgency and the opportunity cost of delay.' },
                { q: 'Is your content output growing faster than your team headcount right now?', why: 'Opens the capacity gap and headcount avoidance conversation.' },
                { q: 'Where do you store different types of media across projects, and how do teams actually access it?', why: 'Surfaces active storage volume, duplication, and current storage spend.' },
              ].map((item, i) => (
                <div key={i} className="flex gap-3 bg-gray-50 rounded-xl px-4 py-3">
                  <span className="text-[#FA0F00] font-black text-sm shrink-0 mt-0.5">{i + 1}</span>
                  <div>
                    <p className="text-sm text-gray-800 font-medium leading-snug">{item.q}</p>
                    <p className="text-xs text-gray-400 mt-1 italic">{item.why}</p>

          <Card>
            <SectionTitle>Hard-Dollar Savings <span className="text-gray-400 font-normal text-sm">(optional; enter only what's realistic)</span></SectionTitle>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <Label htmlFor="hdsave"
                  tip="Annual spend on storage, transfer fees, redundant tools, or infrastructure that Frame could realistically reduce. Do not include productivity capacity here.">
                  Current Annual Spend That Could Be Reduced

                <Input id="hdsave" type="number" value={s.currentSpendToReduce}
                  onChange={v => u('currentSpendToReduce', v)} prefix="$" placeholder="0" min="0" />

    // ═══════════════════════════════════════════════════════════════════

    // ═══════════════════════════════════════════════════════════════════

        { id: 'expected',     label: 'Expected',     desc: 'Entered estimate as-is',              color: 'text-blue-700' },
        { id: 'high-impact',  label: 'High-Impact',  desc: '150% of entered estimate',           color: 'text-emerald-700' },
      ];
      return (
        <div className="flex gap-1 bg-gray-100 rounded-lg p-1">
          {scenarios.map(sc => (
            <button key={sc.id}
              onClick={() => onChange(sc.id)}
              className={`scenario-tab flex-1 py-1.5 px-2 rounded-md text-xs font-medium

    // ═══════════════════════════════════════════════════════════════════

                  <div className="text-3xl font-black leading-tight">{fmt.currency(calc.totalSoftwareCost)}</div>
                </div>
                <div className="grid grid-cols-2 gap-2">

                    <div className="text-[10px] font-semibold uppercase tracking-wide opacity-60 mb-1">Managed Storage</div>
                    <div className="text-xl font-bold leading-tight">{fmt.tb(calc.includedManagedTB)}</div>

                <div>

                  </div>

    // ═══════════════════════════════════════════════════════════════════
    //  ASSUMPTIONS PANEL
    // ═══════════════════════════════════════════════════════════════════
    function AssumptionsPanel({ s, u, calc }) {
      const [open, setOpen] = useState(false);

      if (!calc.totalInvestment) return null;

      const rows = [
        { label: 'Plan', value: calc.plan?.name || '-' },
        { label: 'Buying Program', value: calc.program?.fullName || '-' },
        { label: 'Seats', value: fmt.num(calc.seats) },
        { label: 'Price per seat', value: calc.pricePerSeat != null ? fmt.currency(calc.pricePerSeat) : '-' },
        { label: 'Price level', value: s.priceLevel },
        { label: 'Base software cost', value: fmt.currency(calc.baseSoftwareCost) },
        { label: 'Additional managed storage', value: calc.addManagedTB > 0 ? `${fmt.tb(calc.addManagedTB)} × ${fmt.currency(PC.addons.managedStorage.pricing[s.priceLevel]??PC.addons.managedStorage.pricing.target)}/TB` : '-' },
        { label: 'Additional mounted storage', value: parseInt(s.additionalMountedBlocks) > 0 ? `${s.additionalMountedBlocks} × 10TB blocks` : '-' },
        { label: 'Included managed storage', value: fmt.tb(calc.includedManagedTB) },
        { label: 'Included mounted storage', value: fmt.tb(calc.includedMountedTB) },
        { label: 'Total annual investment', value: fmt.currency(calc.totalInvestment) },
        null,
        { label: 'Active media (current)', value: fmt.tb(calc.activeMediaTB) },
        { label: 'Projected media (12 mo)', value: fmt.tb(calc.projectedMediaTB) },
        { label: 'Duplication factor', value: calc.dupFactor != null ? `${calc.dupFactor}×` : 'Not entered' },
        null,
        { label: 'Participants', value: fmt.num(calc.participants), editable: true, field: 'participants' },
        { label: 'Hourly labor cost', value: fmt.currency(calc.hourlyRate), editable: true, field: 'hourlyLaborCost' },
        { label: 'Minutes saved / person / week', value: fmt.num(parseFloat(s.minutesSavedPerWeek)||0, 0), editable: true, field: 'minutesSavedPerWeek' },
        { label: 'Scenario multiplier', value: `${calc.mult}× (${s.activeScenario})` },

        { label: 'Working weeks / year', value: fmt.num(PC.rules.workingWeeksPerYear) },

          {open && (
            <div className="bg-white px-5 py-4">
              <p className="text-xs text-gray-500 mb-3">
                All values driving the calculations. Edit the fields marked with a pencil (✏) to update outputs without navigating to the original step.
              </p>
              <table className="w-full text-xs">
                <tbody>
                  {rows.map((row, i) => {
                    if (!row) return <tr key={i}><td colSpan={2} className="py-1"><div className="border-t border-gray-100" /></td></tr>;
                    return (
                      <tr key={i} className="border-b border-gray-50">
                        <td className="py-1.5 pr-4 text-gray-500 w-1/2">{row.label}</td>
                        <td className="py-1.5 font-medium text-gray-900 text-right">

                            <input
                              type="number"
                              value={s[row.field]}

              </table>
            </div>
