        { label: 'Working weeks / year', value: fmt.num(PC.rules.workingWeeksPerYear) },
        { label: 'Hours in 1 FTE', value: fmt.num(calc.fteHoursPerYear) },
        { label: 'Hard-dollar savings', value: fmt.currency(calc.hardDollarSavings), editable: true, field: 'currentSpendToReduce' },
        { label: 'Creative team size', value: calc.creativeTeamSize > 0 ? fmt.num(calc.creativeTeamSize) : 'Not entered', editable: true, field: 'creativeTeamSize' },
        null,
        { label: 'Annual projects', value: fmt.num(parseFloat(s.annualProjects) || 0), editable: true, field: 'annualProjects' },
        { label: 'Review rounds / project', value: fmt.num(parseFloat(s.reviewRoundsPerProject) || 0, 1), editable: true, field: 'reviewRoundsPerProject' },
        { label: 'Days per review round today', value: fmt.num(parseFloat(s.reviewDaysPerRound) || 0, 1), editable: true, field: 'reviewDaysPerRound' },
        { label: 'Review cycle reduction (entered, %)', value: fmt.num(parseFloat(s.reviewReductionPct) || 0, 0), editable: true, field: 'reviewReductionPct' },
        { label: 'Concept to delivery, avg. days', value: fmt.num(parseFloat(s.projectCycleDays) || 0, 0), editable: true, field: 'projectCycleDays' },
        { label: 'Team hours per project', value: fmt.num(parseFloat(s.hoursPerProject) || 0, 0), editable: true, field: 'hoursPerProject' },
        null,
        { label: 'Hours returned / person / year', value: fmt.num(calc.hoursPerPersonYear, 1) },
        { label: 'Team hours returned / year', value: fmt.num(calc.teamHoursBack, 0) },
        { label: 'FTE of capacity returned', value: fmt.num(calc.fteBack, 1) },
        { label: 'Review days saved / project', value: calc.drivers.daysPerProject != null ? fmt.num(calc.drivers.daysPerProject, 1) : 'N/A' },
        { label: 'Concept to delivery, faster by', value: calc.drivers.fasterPct != null ? fmt.num(calc.drivers.fasterPct, 0) + '%' : 'N/A' },
        { label: 'Capacity for more projects / year', value: calc.drivers.extraProjects != null ? fmt.num(calc.drivers.extraProjects, 0) : 'N/A' },
      ];

      return (
        <div className="mt-4 border border-gray-200 rounded-xl overflow-hidden">
          <button
            onClick={() => setOpen(!open)}
            className="w-full flex items-center justify-between px-5 py-3 bg-gray-50 text-sm font-medium text-gray-700 hover:bg-gray-100 transition-colors"
          >
            <span>Assumptions &amp; Inputs (edit any value)</span>
            <span className="text-gray-400">{open ? '▲' : '▼'}</span>
          </button>
          {open && (
            <div className="bg-white px-5 py-4">
              <p className="text-xs text-gray-500 mb-3">
                All values driving the calculations. Edit the fields marked with a pencil (✏) to update outputs without navigating to the original step.
              </p>
              <table className="w-full text-xs">
                <tbody>
                  {rows.map((row, i) => {
                    if (!row) return <tr key={i}><td colSpan={2} className="py-1"><div className="border-t border-gray-100" /></td></tr>;
                    return (
                      <tr key={i} className="border-b border-gray-50">
                        <td className="py-1.5 pr-4 text-gray-500 w-1/2">{row.label}</td>
                        <td className="py-1.5 font-medium text-gray-900 text-right">
                          {row.editable ? (
                            <input
                              type="number"
                              value={s[row.field]}
                              onChange={e => u(row.field, e.target.value)}
                              className="w-24 text-right border border-gray-200 rounded px-2 py-0.5 text-xs field-input"
                            />
                          ) : row.value}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════
    //  EXECUTIVE NARRATIVE GENERATOR
    // ═══════════════════════════════════════════════════════════════════
    function generateNarrative(s, calc) {
      if (!calc.totalInvestment || !calc.plan) return '';
      const name = s.customerName || 'this organization';
      const planName = calc.plan.shortName;

      let text = '';
      const d = calc.drivers;
      const areas = FRICTION_AREAS.filter(a => calc.frictionAreas.includes(a.id)).map(a => a.label.toLowerCase());
      const joinList = arr => arr.length <= 1 ? arr.join('') : arr.slice(0, -1).join(', ') + ' and ' + arr[arr.length - 1];

      text += `Frame.io ${planName} is built to give ${name} time back in review, approval, and media handling. `;

      if (calc.teamHoursBack > 0) {
        text += `At ${fmt.num(calc.adjMinutesSaved, 0)} minutes per person per week across ${fmt.num(calc.participants)} people (${s.activeScenario} scenario), that is about ${fmt.num(calc.teamHoursBack, 0)} hours a year, or roughly ${fmt.num(calc.fteBack, 1)} full-time equivalents of capacity. `;
        text += `The time comes back in small pieces across the team, not as one open role. `;
      }

      if (d.daysPerProject != null) {
        text += `Shortening each review round by ${fmt.num(d.reductionPct, 0)}% saves about ${fmt.num(d.daysPerProject, 1)} days per project`;
        if (d.fasterPct != null) text += `, which is roughly ${fmt.num(d.fasterPct, 0)}% off concept-to-delivery time`;
        text += `. `;
      }

      if (d.extraProjects != null) {
        text += `Across the team, that returned time is equivalent to about ${fmt.num(d.extraProjects, 0)} more projects a year without adding people. `;
      }

      if (areas.length > 0) {
        text += `${name} expects the biggest impact in ${joinList(areas)}. `;
      }

      if (calc.hardDollarSavings > 0) {
        text += `${fmt.currency(calc.hardDollarSavings)} in hard-dollar savings from storage, transfer, or redundant tool consolidation was also identified. `;
      }

      // Capacity gap
      if (calc.capacityGapPct != null && calc.capacityGapPct > 0) {
        text += `Content demand is expected to grow ${fmt.pct(calc.contentGrowthPct)} while headcount grows only ${fmt.pct(calc.headcountGrowthPct)}. `;
        if (calc.gapFTE != null) {
          text += `That is roughly ${fmt.num(calc.gapFTE, 1)} people's worth of work the current plan does not staff, and the time Frame returns covers about ${fmt.num(calc.gapCoveragePct, 0)}% of it. `;
        } else {
          text += `The time Frame returns helps the team absorb that growth with the people it already has. `;
        }
      }

      text = text.trimEnd();
      text += ' All figures are estimates based on the assumptions entered and are intended as a starting point for discussion, not a guarantee of outcomes.';
      return text;
    }

    // ═══════════════════════════════════════════════════════════════════
    //  STEP 4, PROPOSAL / EXECUTIVE SUMMARY
    // ═══════════════════════════════════════════════════════════════════
    function Step4({ s, u, calc }) {
      const narrative = generateNarrative(s, calc);
      const [copied, setCopied] = useState(false);
      const d = calc.drivers;
      const areaLabels = FRICTION_AREAS.filter(a => calc.frictionAreas.includes(a.id)).map(a => a.label);
      const hasDrivers = d.daysPerProject != null || d.fasterPct != null || d.extraProjects != null;

      function buildTextExport() {
        const lines = [
          `FRAME.IO VALUE & PROPOSAL SUMMARY`,
          `Generated: ${new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}`,
          ``,
          `━━━ CUSTOMER ━━━`,
          `Company: ${s.customerName || '-'}`,
          `Opportunity: ${s.opportunityName || '-'}`,
          ``,
          `━━━ TIME BACK ━━━`,
          `Participating Users: ${fmt.num(calc.participants)}`,
          `Est. Minutes Saved / Person / Week (${s.activeScenario}): ${fmt.num(calc.adjMinutesSaved, 0)}`,
          `Hours Returned / Person / Year: ${fmt.num(calc.hoursPerPersonYear, 1)}`,
          `Team Hours Returned / Year: ${fmt.num(calc.teamHoursBack, 0)}`,
          `FTE of Capacity Returned: ${fmt.num(calc.fteBack, 1)} (1 FTE = ${fmt.num(calc.fteHoursPerYear)} hours)`,
          `  (Time returns in small pieces across ${fmt.num(calc.participants)} people; not a headcount reduction)`,
          `Scenario Range (FTE): Conservative ${fmt.num(calc.scenarioResults['conservative'].fte, 1)} | Expected ${fmt.num(calc.scenarioResults['expected'].fte, 1)} | High-Impact ${fmt.num(calc.scenarioResults['high-impact'].fte, 1)}`,
          ``,
        ];

        if (hasDrivers || areaLabels.length > 0) {
          lines.push(`━━━ WHAT IT UNLOCKS ━━━`);
          if (d.daysPerProject != null) {
            lines.push(`Review and Approval: ${fmt.num(d.daysPerProject, 1)} days saved per project (${fmt.num(d.reductionPct, 0)}% shorter review cycle)` + (d.daysPerYear != null ? `, about ${fmt.num(d.daysPerYear, 0)} days a year` : ''));
          }
          if (d.fasterPct != null) lines.push(`Speed to Market: concept to delivery about ${fmt.num(d.fasterPct, 0)}% faster`);
          if (d.extraProjects != null) lines.push(`Capacity: about ${fmt.num(d.extraProjects, 0)} more projects a year with the same team`);
          if (areaLabels.length > 0) lines.push(`Areas of Impact: ${areaLabels.join('; ')}`);
          lines.push(``);
        }

        if (calc.hardDollarSavings > 0 || calc.reviewDelayHours > 0) {
          lines.push(`━━━ OTHER INPUTS ━━━`);
          if (calc.hardDollarSavings > 0) lines.push(`Hard-Dollar Savings Identified: ${fmt.currency(calc.hardDollarSavings)}`);
          if (calc.reviewDelayHours > 0) lines.push(`Review Delay Reported: ${fmt.num(calc.reviewDelayHours, 0)} hours / year`);
          lines.push(``);
        }

        if (calc.capacityGapPct != null) {
          lines.push(`━━━ CAPACITY GAP ━━━`);
          lines.push(`Content Demand Growth: +${fmt.pct(calc.contentGrowthPct)}`);
          lines.push(`Headcount Growth: +${fmt.pct(calc.headcountGrowthPct)}`);
          lines.push(`Capacity Gap: ${fmt.num(calc.capacityGapPct)} percentage points`);
          if (calc.gapFTE != null) {
            lines.push(`Unstaffed Work: about ${fmt.num(calc.gapFTE, 1)} people (team of ${fmt.num(calc.creativeTeamSize)})`);
            lines.push(`Share of Gap Covered by Time Returned: ${fmt.num(calc.gapCoveragePct, 0)}%`);
          }
          lines.push(``);
        }

        lines.push(`━━━ EXECUTIVE SUMMARY ━━━`);
        lines.push(narrative);
        lines.push(``);
        lines.push(`━━━ RECOMMENDED CONFIGURATION ━━━`);
        lines.push(`Plan: ${calc.plan?.name || '-'}`);
        lines.push(`Buying Program: ${calc.program?.fullName || '-'}`);
        lines.push(`Seats: ${fmt.num(calc.seats)}`);
        lines.push(`Included Managed Storage: ${fmt.tb(calc.includedManagedTB)}`);
        lines.push(`Included Mounted Storage: ${fmt.tb(calc.includedMountedTB)}`);
        lines.push(`Price Level: ${s.priceLevel}`);
        lines.push(`Estimated Annual Investment: ${fmt.currency(calc.totalSoftwareCost)}`);
        lines.push(``);
        lines.push(`━━━ ASSUMPTIONS ━━━`);
        lines.push(`All values based on inputs entered. Conservative scenario = 50% of the entered estimates.`);
        lines.push(`Expected = as entered. High-Impact = 150%. Hard-dollar savings unchanged across scenarios.`);
        lines.push(`Hours and FTE are time potentially returned to the team, not cash savings or a headcount reduction.`);

        return lines.join('\n');
      }

      function handleCopy() {
        navigator.clipboard.writeText(buildTextExport()).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        });
      }

      if (!calc.plan) {
        return (
          <Card>
            <div className="text-center py-10 text-gray-400">
              Complete Steps 1–3 to generate your proposal.
            </div>
          </Card>
        );
      }

      return (
        <div className="space-y-5">
          {/* Controls */}
          <div className="flex flex-wrap items-center justify-between gap-3 no-print">
            <div>
              <p className="text-sm font-medium text-gray-700 mb-1">Scenario</p>
              <ScenarioSelector value={s.activeScenario} onChange={v => u('activeScenario', v)} />
            </div>
            <div className="flex gap-2">
              <button onClick={handleCopy}
                className="flex items-center gap-2 px-4 py-2 bg-gray-900 text-white text-sm font-medium rounded-lg hover:bg-gray-700 transition-colors">
                {copied ? '✓ Copied!' : '📋 Copy Proposal'}
              </button>
              <button onClick={() => window.print()}
                className="flex items-center gap-2 px-4 py-2 border border-gray-300 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-50 transition-colors">
                🖨 Print / PDF
              </button>
            </div>
          </div>

          {/* Print header (only visible when printing) */}
          <div className="print-only mb-6">
            <div className="flex items-center gap-3 mb-4">
              <div className="w-8 h-8 bg-[#FA0F00] rounded flex items-center justify-center">
                <svg viewBox="0 0 20 20" fill="white" width="18" height="18">
                  <rect x="2" y="2" width="7" height="7" rx="1"/>
                  <rect x="11" y="2" width="7" height="7" rx="1"/>
                  <rect x="2" y="11" width="7" height="7" rx="1"/>
                  <rect x="11" y="11" width="7" height="7" rx="1"/>
                </svg>
              </div>
              <div>
                <p className="font-bold text-gray-900 text-lg">Frame.io Value &amp; Proposal</p>
                <p className="text-sm text-gray-500">{s.customerName} {s.opportunityName ? `· ${s.opportunityName}` : ''} · {new Date().toLocaleDateString()}</p>
              </div>
            </div>
          </div>

          {/* Section 1: Value */}
          <Card>
            <h2 className="text-lg font-bold text-gray-900 mb-4">What Frame Gives {s.customerName || 'the Team'}</h2>

            {calc.teamHoursBack > 0 && (
              <div className="bg-[#1c1c1c] text-white rounded-xl p-6 mb-4">
                <p className="text-sm font-medium opacity-80 mb-1">Capacity Returned</p>
                <p className="text-4xl font-black mb-1">{fmt.num(calc.fteBack, 1)} FTE</p>
                <p className="text-base font-semibold opacity-90">{fmt.num(calc.teamHoursBack, 0)} hours a year</p>
                <p className="text-sm opacity-75 mt-3 max-w-xl">
                  At {fmt.num(calc.adjMinutesSaved, 0)} minutes per person per week across {fmt.num(calc.participants)} people.
                  The time comes back in small pieces across the team, not as one open role.
                </p>
              </div>
            )}

            {/* Value drivers */}
            {hasDrivers && (
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                {d.daysPerProject != null && (
                  <div className="bg-blue-50 border border-blue-100 rounded-lg p-4">
                    <p className="text-xs font-semibold text-blue-900 uppercase tracking-wide mb-1">Review &amp; approval</p>
                    <p className="text-2xl font-bold text-blue-900">{fmt.num(d.daysPerProject, 1)} days</p>
                    <p className="text-xs text-blue-700 mt-1">
                      saved per project with a {fmt.num(d.reductionPct, 0)}% shorter review cycle
                      {d.daysPerYear != null ? `, about ${fmt.num(d.daysPerYear, 0)} days a year` : ''}.
                    </p>
                  </div>
                )}
                {d.fasterPct != null && (
                  <div className="bg-blue-50 border border-blue-100 rounded-lg p-4">
                    <p className="text-xs font-semibold text-blue-900 uppercase tracking-wide mb-1">Speed to market</p>
                    <p className="text-2xl font-bold text-blue-900">{fmt.num(d.fasterPct, 0)}% faster</p>
                    <p className="text-xs text-blue-700 mt-1">
                      concept to delivery, from {fmt.num(parseFloat(s.projectCycleDays) || 0, 0)} days today.
                    </p>
                  </div>
                )}
                {d.extraProjects != null && (
                  <div className="bg-blue-50 border border-blue-100 rounded-lg p-4">
                    <p className="text-xs font-semibold text-blue-900 uppercase tracking-wide mb-1">What it unlocks</p>
                    <p className="text-2xl font-bold text-blue-900">about {fmt.num(d.extraProjects, 0)}</p>
                    <p className="text-xs text-blue-700 mt-1">
                      more projects a year with the same team, at {fmt.num(parseFloat(s.hoursPerProject) || 0, 0)} hours per project.
                    </p>
                  </div>
                )}
              </div>
            )}
            {!hasDrivers && (
              <div className="bg-gray-50 border border-gray-100 rounded-lg p-3 text-sm text-gray-500 mb-4 no-print">
                Add review cycle days, expected reduction, and project details in Step 3 to show days saved, speed to market, and what the time unlocks.
              </div>
            )}

            {areaLabels.length > 0 && (
              <div className="mb-4">
                <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Areas of impact</p>
                <div className="flex flex-wrap gap-2">
                  {areaLabels.map(l => (
                    <span key={l} className="px-3 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-700 border border-gray-200">{l}</span>
                  ))}
                </div>
              </div>
            )}

            {/* Metric cards */}
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-4">
              <MetricCard label="Hours Returned / Year" value={fmt.num(calc.teamHoursBack, 0)}
                sub="Team total" color="purple"
                tip="Participants × minutes saved per week ÷ 60 × 48 working weeks." />
              <MetricCard label="FTE Returned" value={fmt.num(calc.fteBack, 1)}
                sub={`${fmt.num(calc.fteHoursPerYear)} hours = 1 FTE`} color="purple"
                tip="Team hours returned ÷ hours in one full-time year. Time comes back in small pieces across many people." />
              {calc.hardDollarSavings > 0 && (
                <MetricCard label="Hard-Dollar Savings" value={fmt.currency(calc.hardDollarSavings, true)}
                  sub="Actual spend reduction" color="green"
                  tip="Entered spend that may be eliminated or reduced: storage, tools, infrastructure." />
              )}
              {calc.reviewDelayHours > 0 && (
                <MetricCard label="Review Delay / Year" value={fmt.num(calc.reviewDelayHours, 0) + ' hrs'}
                  sub="Reported by customer" color="amber"
                  tip="Projects × review rounds × coordination delay hours. Shown for context; not added to hours returned." />
              )}
            </div>

            <div className="bg-purple-50 border border-purple-100 rounded-lg p-3 text-sm mb-4">
              <p className="font-semibold text-purple-900 mb-1">About the time returned</p>
              <p className="text-xs text-purple-700">
                This is time potentially returned to higher-value work. It is not a guarantee of cash savings or headcount reduction.
                What the team does with that time is the value.
              </p>
            </div>

            {/* Scenario comparison */}
            <div>
              <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Scenario Comparison</p>
              <div className="grid grid-cols-3 gap-2">
                {[
                  { id: 'conservative', label: 'Conservative' },
                  { id: 'expected',     label: 'Expected' },
                  { id: 'high-impact',  label: 'High-Impact' },
                ].map(sc => {
                  const r = calc.scenarioResults[sc.id];
                  return (
                    <div key={sc.id}
                      className={`rounded-lg p-3 border text-xs ${s.activeScenario === sc.id ? 'border-[#FA0F00] bg-red-50' : 'border-gray-200 bg-gray-50'}`}>
                      <p className="font-semibold text-gray-700 mb-2">{sc.label}</p>
                      <p className="text-gray-600">Min / wk: <span className="font-medium">{fmt.num(r.minutes, 0)}</span></p>
                      <p className="text-gray-600">Hours / yr: <span className="font-medium">{fmt.num(r.hours, 0)}</span></p>
                      <p className="text-gray-600">FTE: <span className="font-medium">{fmt.num(r.fte, 1)}</span></p>
                      {r.daysPerProject != null && (
                        <p className="text-gray-600">Review days saved: <span className="font-medium">{fmt.num(r.daysPerProject, 1)}</span></p>
                      )}
                      {r.extraProjects != null && (
                        <p className="text-gray-600">More projects: <span className="font-medium">{fmt.num(r.extraProjects, 0)}</span></p>
                      )}
                    </div>
                  );
                })}
              </div>
              <p className="text-xs text-gray-400 mt-2">
                Hard-dollar savings ({fmt.currency(calc.hardDollarSavings)}) are unchanged across scenarios.
                Only the time and review estimates scale.
              </p>
            </div>

            {/* Capacity gap */}
            {calc.capacityGapPct != null && calc.capacityGapPct > 0 && (
              <div className="mt-4 bg-amber-50 border border-amber-100 rounded-lg p-4">
                <p className="text-sm font-semibold text-amber-900 mb-1">Capacity Gap</p>
                <p className="text-2xl font-bold text-amber-800 mb-1">+{fmt.num(calc.capacityGapPct)} pp</p>
                <p className="text-sm text-amber-800">
                  Content demand is expected to grow <strong>{fmt.pct(calc.contentGrowthPct)}</strong> while
                  creative headcount grows only <strong>{fmt.pct(calc.headcountGrowthPct)}</strong>.
                  {calc.gapFTE != null
                    ? <> That is roughly <strong>{fmt.num(calc.gapFTE, 1)} people's worth</strong> of work the current plan does not staff.
                        The time Frame returns equals about {fmt.num(calc.fteBack, 1)} FTE, or <strong>{fmt.num(calc.gapCoveragePct, 0)}%</strong> of that gap.</>
                    : ' The time Frame returns helps the team absorb that growth with the people it already has.'}
                  {' '}The time comes back in small pieces across many people, not as one open role.
                </p>
              </div>
            )}
          </Card>

          {/* Section 2: Executive Narrative */}
          <Card>
            <h2 className="text-lg font-bold text-gray-900 mb-3">Executive Narrative</h2>
            <p className="text-xs text-gray-500 mb-3 no-print">
              Paste this into an email, proposal document, or executive readout. Adjust as needed.
            </p>
            <div className="bg-gray-50 rounded-lg p-4 text-sm text-gray-800 leading-relaxed border border-gray-200">
              {narrative || <span className="text-gray-400">Complete Steps 1–3 to generate the narrative.</span>}
            </div>
          </Card>

          {/* Section 3: Configuration and investment */}
          <Card>
            <h2 className="text-lg font-bold text-gray-900 mb-4">Recommended Configuration</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <p className="text-xs text-gray-500 uppercase tracking-wide font-medium mb-3">Plan &amp; Licensing</p>
                <div className="space-y-2 text-sm">
                  <div className="flex justify-between">
                    <span className="text-gray-600">Plan</span>
                    <span className="font-semibold">{calc.plan.name}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-gray-600">Buying Program</span>
                    <span className="font-semibold">{calc.program?.name}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-gray-600">Seats</span>
                    <span className="font-semibold">{fmt.num(calc.seats)}</span>
                  </div>
                  {calc.pricePerSeat && (
                    <div className="flex justify-between">
                      <span className="text-gray-600">Price / Seat ({s.priceLevel})</span>
                      <span className="font-semibold">{fmt.currency(calc.pricePerSeat)}</span>
                    </div>
                  )}
                </div>
              </div>
              <div>
                <p className="text-xs text-gray-500 uppercase tracking-wide font-medium mb-3">Storage</p>
                <div className="space-y-2 text-sm">
                  <div className="flex justify-between">
                    <span className="text-gray-600">Included Managed</span>
                    <span className="font-semibold">{fmt.tb(calc.includedManagedTB)}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-gray-600">Mounted Storage</span>
                    <span className="font-semibold">{fmt.tb(calc.includedMountedTB)}</span>
                  </div>
                  {calc.projectedMediaTB > 0 && (
                    <div className="flex justify-between">
                      <span className="text-gray-600">Projected media need</span>
                      <span className={`font-semibold ${calc.storageGapTB > 0 ? 'text-amber-600' : 'text-emerald-600'}`}>
                        {fmt.tb(calc.projectedMediaTB)} {calc.storageGapTB > 0 ? '⚠' : '✓'}
                      </span>
                    </div>
                  )}
                </div>
              </div>
            </div>
            <div className="mt-4 pt-4 border-t">
              <div className="flex items-center justify-between">
                <span className="text-base font-semibold text-gray-900">Estimated Annual Investment</span>
                <span className="text-2xl font-bold text-gray-900">{fmt.currency(calc.totalSoftwareCost)}</span>
              </div>
              {calc.storageGapTB > 0 && (
                <p className="text-xs text-amber-600 mt-1">
                  ⚠ Projected media volume exceeds included storage by {fmt.tb(calc.storageGapTB)}.
                  Adding {fmt.tb(calc.recommendedAddTB)} managed storage would add ~{fmt.currency(calc.recommendedAddStorageCost)}/year.
                </p>
              )}
            </div>
          </Card>

          {/* Disclaimer */}
          <div className="text-xs text-gray-400 leading-relaxed">
            <strong>Important:</strong> All figures are estimates based on inputs provided and are intended as a starting point for discussion.
            Hours and FTE returned represent time potentially returned to higher-value work and are not a guarantee of cash savings or headcount reduction.
            Hard-dollar savings reflect only spend explicitly identified by the seller. Review cycle and project figures come from the customer's own inputs.
            Actual outcomes depend on adoption, workflow change, and business context.
            Prices shown at {s.priceLevel} pricing; final pricing subject to Deal Desk review.
          </div>

          {/* Assumptions panel */}
          <AssumptionsPanel s={s} u={u} calc={calc} />
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════
    //  NAVIGATION BUTTONS
    // ═══════════════════════════════════════════════════════════════════
    function NavButtons({ step, setStep, calc }) {
      const canNext = () => {
        if (step === 0) return calc.plan && calc.seats >= 10 && calc.errors.length === 0;
        if (step === 1) return true;
        if (step === 2) return calc.participants > 0 && calc.adjMinutesSaved > 0;
        return false;
      };
      const labels = ['Continue to Storage →', 'Continue to Value →', 'Generate Proposal →', ''];
      return (
        <div className="flex justify-between mt-6 pt-4 border-t border-gray-200 no-print">
          <button
            onClick={() => setStep(s => Math.max(0, s - 1))}
            className={`px-5 py-2.5 text-sm font-medium rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50 transition-colors ${step === 0 ? 'invisible' : ''}`}
          >
            ← Back
          </button>
          {step < 3 && (
            <button
              onClick={() => setStep(s => s + 1)}
              disabled={!canNext()}
              className={`px-6 py-2.5 text-sm font-medium rounded-lg transition-colors
                ${canNext()
                  ? 'bg-[#FA0F00] text-white hover:bg-[#d90d00] shadow-sm'
                  : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}
            >
              {labels[step]}
            </button>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════
    //  APP ROOT
    // ═══════════════════════════════════════════════════════════════════
    function App() {
      const [step, setStep] = useState(0);
      const [s, setState] = useState({
        customerName: '',
        opportunityName: '',
        buyingProgram: '',
        plan: '',
        seats: '',
        priceLevel: 'target',
        // Add-ons
        additionalManagedTB: '0',
        additionalMountedBlocks: '1',
        // Step 2
        activeMediaTB: '',
        annualGrowthPct: '',
        currentStorageSpend: '',
        duplicationFactor: '',
        // Step 3 (participants derives from seats × participantsRatio when blank)
        participants: '',
        participantsRatio: '2',
        activePreset: '',
        creativeTeamSize: '',
        reviewDaysPerRound: '',
        reviewReductionPct: '',
        projectCycleDays: '',
        hoursPerProject: '',
        frictionAreas: [],
        minutesSavedPerWeek: '30',
        currentSpendToReduce: '',
        annualProjects: '',
        reviewRoundsPerProject: '',
        hoursDelayPerReview: '',
        contentDemandGrowthPct: '',
        headcountGrowthPct: '',
        // Custom price overrides (leave blank to use table price)
        customPricePerSeat: '',
        customManagedPrice: '',
        customMountedPrice: '',
        // Global
        activeScenario: 'expected',
      });

      const u = useCallback((key, value) => {
        setState(prev => ({ ...prev, [key]: value }));
      }, []);

      const calc = useMemo(() => calculate(s), [s]);

      // Persist to sessionStorage
      useEffect(() => {
        try {
          const saved = sessionStorage.getItem('frame-roi-state');
          if (saved) {
            const parsed = JSON.parse(saved);
            setState(prev => ({ ...prev, ...parsed }));
          }
        } catch {}
      }, []);

      useEffect(() => {
        try {
          sessionStorage.setItem('frame-roi-state', JSON.stringify(s));
        } catch {}
      }, [s]);

      const stepProps = { s, u, calc };

      return (
        <div className="min-h-screen bg-[#f5f5f5]">
          <Header />
          <StepProgress current={step} onGo={newStep => { if (newStep <= step) setStep(newStep); }} />

          <div className="max-w-screen-xl mx-auto px-4 py-6 print-page">
            {/* Layout: form (left) + results sidebar (right) */}
            <div className={`${step < 3 ? 'lg:grid lg:grid-cols-5 lg:gap-6' : ''}`}>
              {/* Main form area */}
              <div className={step < 3 ? 'lg:col-span-3' : ''}>
                {step === 0 && <Step1 {...stepProps} />}
                {step === 1 && <Step2 {...stepProps} />}
                {step === 2 && <Step3 {...stepProps} />}
                {step === 3 && <Step4 {...stepProps} />}
                <NavButtons step={step} setStep={setStep} calc={calc} />
              </div>

              {/* Sticky results sidebar (steps 0–2 only) */}
              {step < 3 && (
                <div className="lg:col-span-2 mt-6 lg:mt-0">
                  <div className="sticky top-6">
                    <ResultsPanel {...stepProps} currentStep={step} />
                    {step > 0 && <AssumptionsPanel {...stepProps} />}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
