        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════
    //  EXECUTIVE NARRATIVE GENERATOR
    // ═══════════════════════════════════════════════════════════════════
    function generateNarrative(s, calc) {
      if (!calc.totalInvestment || !calc.plan) return '';
      const name = s.customerName || 'this organization';
      const planName = calc.plan.shortName;
      const invest = fmt.currency(calc.totalInvestment);

      let text = '';

      if (calc.hardDollarsCoverInvestment) {
        text += `Based on the workflow profile provided, the modeled hard-dollar savings of ${fmt.currency(calc.hardDollarSavings)} per year are estimated to fully offset the annual Frame.io ${planName} investment of ${invest}. `;
        text += `Any productivity gains represent entirely additional value on top of the investment.`;
      } else {
        text += `Based on ${name}'s current workflow profile, Frame.io does not require a dramatic productivity improvement to justify the investment. `;
        if (calc.breakEvenMinutes != null) {
          text += `At an estimated annual investment of ${invest}, Frame would need to recover approximately ${fmt.num(calc.breakEvenMinutes, 0)} minutes per participant per week to reach break-even. `;
        }
      }

      // Friction context
      if (s.minutesSavedPerWeek) {
        const frictionAreas = [];
        if (s.activeMediaTB) frictionAreas.push('file movement and media access');
        frictionAreas.push('version management');
        frictionAreas.push('review coordination');
        frictionAreas.push('feedback consolidation');
        text += `The team identified ${frictionAreas.join(', ')} as recurring sources of workflow friction. `;
      }

      // Value summary
      if (calc.productiveCapacityValue > 0) {
        text += `Reducing even a portion of that overhead creates a credible path to positive ROI, estimated at ${fmt.currency(calc.productiveCapacityValue)} in productive capacity annually under the expected scenario. `;
      }

      if (calc.hardDollarSavings > 0 && !calc.hardDollarsCoverInvestment) {
        text += `An additional ${fmt.currency(calc.hardDollarSavings)} in hard-dollar savings from storage, transfer, or redundant tool consolidation was identified. `;
      }

      // ROI / payback
      if (calc.roi != null && calc.roi > 0) {
        text += `At these assumptions, the estimated ROI is ${fmt.pct(calc.roi, 0)} with a ${fmt.months(calc.paybackMonths)} payback period. `;
      }

      // Capacity gap
      if (calc.capacityGapPct != null && calc.capacityGapPct > 0) {
        text += `With content demand expected to grow ${fmt.pct(calc.contentGrowthPct)} while headcount grows only ${fmt.pct(calc.headcountGrowthPct)}, Frame is also well-positioned to help the team scale throughput without proportional headcount additions.`;
      }

      text += ' All figures are estimates based on the assumptions entered and are intended as a starting point for discussion, not a guarantee of outcomes.';
      return text;
    }

    // ═══════════════════════════════════════════════════════════════════
    //  STEP 4, PROPOSAL / EXECUTIVE SUMMARY
    // ═══════════════════════════════════════════════════════════════════
    function Step4({ s, u, calc }) {
      const narrative = generateNarrative(s, calc);
      const [copied, setCopied] = useState(false);

      function buildTextExport() {
        const lines = [
          `FRAME.IO ROI & PROPOSAL SUMMARY`,
          `Generated: ${new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}`,
          ``,
          `━━━ CUSTOMER ━━━`,
          `Company: ${s.customerName || '-'}`,
          `Opportunity: ${s.opportunityName || '-'}`,
          ``,
          `━━━ RECOMMENDED CONFIGURATION ━━━`,
          `Plan: ${calc.plan?.name || '-'}`,
          `Buying Program: ${calc.program?.fullName || '-'}`,
          `Seats: ${fmt.num(calc.seats)}`,
          `Included Managed Storage: ${fmt.tb(calc.includedManagedTB)}`,
          `Included Mounted Storage: ${fmt.tb(calc.includedMountedTB)}`,
          `Price Level: ${s.priceLevel}`,
          `Estimated Annual Investment: ${fmt.currency(calc.totalSoftwareCost)}`,
          ``,
          `━━━ BUSINESS CASE ━━━`,
          `Participating Users: ${fmt.num(calc.participants)}`,
          `Avg. Fully Loaded Hourly Cost: ${fmt.currency(calc.hourlyRate)}`,
          `Est. Minutes Saved / Person / Week (${s.activeScenario}): ${fmt.num(calc.adjMinutesSaved, 0)}`,
          ``,
          `Productive Capacity Recovered: ${fmt.currency(calc.productiveCapacityValue)}`,
          `  (Value of time returned to higher-value work; not cash savings)`,
          `Hard-Dollar Savings: ${fmt.currency(calc.hardDollarSavings)}`,
          `Total Quantified Annual Value: ${fmt.currency(calc.totalQuantifiedValue)}`,
          `Annual Frame Investment: ${fmt.currency(calc.totalInvestment)}`,
          `Net Annual Value: ${fmt.currency(calc.netAnnualValue)}`,
          `Estimated ROI: ${fmt.pct(calc.roi, 0)}`,
          `Estimated Payback: ${fmt.months(calc.paybackMonths)}`,
          ``,
          `BREAK-EVEN THRESHOLD:`,
          calc.hardDollarsCoverInvestment
            ? `Hard-dollar savings (${fmt.currency(calc.hardDollarSavings)}) fully cover the Frame investment.`
            : `Frame needs to save only ${fmt.num(calc.breakEvenMinutes, 0)} minutes / person / week to pay for itself.`,
          ``,
        ];

        if (calc.capacityGapPct != null) {
          lines.push(`━━━ CAPACITY GAP ━━━`);
          lines.push(`Content Demand Growth: +${fmt.pct(calc.contentGrowthPct)}`);
          lines.push(`Headcount Growth: +${fmt.pct(calc.headcountGrowthPct)}`);
          lines.push(`Capacity Gap: ${fmt.num(calc.capacityGapPct)} percentage points`);
          lines.push(``);
        }

        lines.push(`━━━ EXECUTIVE SUMMARY ━━━`);
        lines.push(narrative);
        lines.push(``);
        lines.push(`━━━ ASSUMPTIONS ━━━`);
        lines.push(`All values based on inputs entered. Conservative scenario = 50% of productivity estimate.`);
        lines.push(`Expected = as entered. High-Impact = 150%. Hard-dollar savings unchanged across scenarios.`);
        lines.push(`Productive capacity value ≠ cash savings. Represents employee time potentially returned to higher-value work.`);

        return lines.join('\n');
      }

      function handleCopy() {
        navigator.clipboard.writeText(buildTextExport()).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        });
      }

      if (!calc.plan) {
        return (
          <Card>
            <div className="text-center py-10 text-gray-400">
              Complete Steps 1–3 to generate your proposal.
            </div>
          </Card>
        );
      }

      return (
        <div className="space-y-5">
          {/* Controls */}
          <div className="flex flex-wrap items-center justify-between gap-3 no-print">
            <div>
              <p className="text-sm font-medium text-gray-700 mb-1">Scenario</p>
              <ScenarioSelector value={s.activeScenario} onChange={v => u('activeScenario', v)} />
            </div>
            <div className="flex gap-2">
              <button onClick={handleCopy}
                className="flex items-center gap-2 px-4 py-2 bg-gray-900 text-white text-sm font-medium rounded-lg hover:bg-gray-700 transition-colors">
                {copied ? '✓ Copied!' : '📋 Copy Proposal'}
              </button>
              <button onClick={() => window.print()}
                className="flex items-center gap-2 px-4 py-2 border border-gray-300 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-50 transition-colors">
                🖨 Print / PDF
              </button>
            </div>
          </div>

          {/* Print header (only visible when printing) */}
          <div className="print-only mb-6">
            <div className="flex items-center gap-3 mb-4">
              <div className="w-8 h-8 bg-[#FA0F00] rounded flex items-center justify-center">
                <svg viewBox="0 0 20 20" fill="white" width="18" height="18">
                  <rect x="2" y="2" width="7" height="7" rx="1"/>
                  <rect x="11" y="2" width="7" height="7" rx="1"/>
                  <rect x="2" y="11" width="7" height="7" rx="1"/>
                  <rect x="11" y="11" width="7" height="7" rx="1"/>
                </svg>
              </div>
              <div>
                <p className="font-bold text-gray-900 text-lg">Frame.io ROI &amp; Proposal</p>
                <p className="text-sm text-gray-500">{s.customerName} {s.opportunityName ? `· ${s.opportunityName}` : ''} · {new Date().toLocaleDateString()}</p>
              </div>
            </div>
          </div>

          {/* Section 1: Configuration */}
          <Card>
            <h2 className="text-lg font-bold text-gray-900 mb-4">Recommended Configuration</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <p className="text-xs text-gray-500 uppercase tracking-wide font-medium mb-3">Plan &amp; Licensing</p>
                <div className="space-y-2 text-sm">
                  <div className="flex justify-between">
                    <span className="text-gray-600">Plan</span>
                    <span className="font-semibold">{calc.plan.name}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-gray-600">Buying Program</span>
                    <span className="font-semibold">{calc.program?.name}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-gray-600">Seats</span>
                    <span className="font-semibold">{fmt.num(calc.seats)}</span>
                  </div>
                  {calc.pricePerSeat && (
                    <div className="flex justify-between">
                      <span className="text-gray-600">Price / Seat ({s.priceLevel})</span>
                      <span className="font-semibold">{fmt.currency(calc.pricePerSeat)}</span>
                    </div>
                  )}
                </div>
              </div>
              <div>
                <p className="text-xs text-gray-500 uppercase tracking-wide font-medium mb-3">Storage</p>
                <div className="space-y-2 text-sm">
                  <div className="flex justify-between">
                    <span className="text-gray-600">Included Managed</span>
                    <span className="font-semibold">{fmt.tb(calc.includedManagedTB)}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-gray-600">Mounted Storage</span>
                    <span className="font-semibold">{fmt.tb(calc.includedMountedTB)}</span>
                  </div>
                  {calc.projectedMediaTB > 0 && (
                    <div className="flex justify-between">
                      <span className="text-gray-600">Projected media need</span>
                      <span className={`font-semibold ${calc.storageGapTB > 0 ? 'text-amber-600' : 'text-emerald-600'}`}>
                        {fmt.tb(calc.projectedMediaTB)} {calc.storageGapTB > 0 ? '⚠' : '✓'}
                      </span>
                    </div>
                  )}
                </div>
              </div>
            </div>
            <div className="mt-4 pt-4 border-t">
              <div className="flex items-center justify-between">
                <span className="text-base font-semibold text-gray-900">Estimated Annual Investment</span>
                <span className="text-2xl font-bold text-gray-900">{fmt.currency(calc.totalSoftwareCost)}</span>
              </div>
              {calc.storageGapTB > 0 && (
                <p className="text-xs text-amber-600 mt-1">
                  ⚠ Projected media volume exceeds included storage by {fmt.tb(calc.storageGapTB)}.
                  Adding {fmt.tb(calc.recommendedAddTB)} managed storage would add ~{fmt.currency(calc.recommendedAddStorageCost)}/year.
                </p>
              )}
            </div>
          </Card>

          {/* Section 2: Business Case */}
          <Card>
            <h2 className="text-lg font-bold text-gray-900 mb-4">Business Case</h2>

            {/* Break-even hero */}
            {calc.breakEvenMinutes != null && (
              <div className="bg-[#1c1c1c] text-white rounded-xl p-6 mb-4">
                <p className="text-sm font-medium opacity-80 mb-1">Break-Even Threshold</p>
                <p className="text-4xl font-black mb-1">{fmt.num(calc.breakEvenMinutes, 0)} min</p>
                <p className="text-base font-semibold opacity-90">per person, per week</p>
                <p className="text-sm opacity-75 mt-3 max-w-xl">
                  Frame.io only needs to save {s.customerName || 'this team'} {fmt.num(calc.breakEvenMinutes, 0)} minutes
                  per participant per week to pay for itself{calc.hardDollarSavings > 0
                    ? ` (after ${fmt.currency(calc.hardDollarSavings)} in hard-dollar savings)` : ''}.
                </p>
              </div>
            )}

            {calc.hardDollarsCoverInvestment && (
              <div className="bg-emerald-600 text-white rounded-xl p-6 mb-4">
                <p className="text-sm font-medium opacity-80 mb-1">Break-Even Status</p>
                <p className="text-xl font-bold">Hard-dollar savings fully cover the investment.</p>
                <p className="text-sm opacity-80 mt-1">
                  {fmt.currency(calc.hardDollarSavings)}/year in identified savings exceeds the {fmt.currency(calc.totalInvestment)} annual investment.
                  Every minute of productivity gained is entirely additional value.
                </p>
              </div>
            )}

            {/* Metric cards */}
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-4">
              <MetricCard label="Annual Frame Investment" value={fmt.currency(calc.totalInvestment, true)} color="blue"
                tip="Total estimated annual software cost based on selected plan, seats, and add-ons." />
              <MetricCard label="Productive Capacity Recovered" value={fmt.currency(calc.productiveCapacityValue, true)}
                sub="Not cash savings" color="purple"
                tip="Value of employee time potentially returned to higher-value work. This is capacity, not guaranteed savings." />
              {calc.hardDollarSavings > 0 && (
                <MetricCard label="Hard-Dollar Savings" value={fmt.currency(calc.hardDollarSavings, true)}
                  sub="Actual spend reduction" color="green"
                  tip="Entered spend that may be eliminated or reduced: storage, tools, infrastructure." />
              )}
              <MetricCard label="Total Quantified Value" value={fmt.currency(calc.totalQuantifiedValue, true)}
                color="green" tip="Productive capacity value + hard-dollar savings." />
              {calc.roi != null && (
                <MetricCard label={`Est. ROI (${s.activeScenario})`} value={fmt.pct(calc.roi, 0)}
                  color={calc.roi >= 0 ? 'green' : 'red'}
                  tip="(Total quantified value − Frame investment) ÷ Frame investment × 100" />
              )}
              {calc.paybackMonths != null && (
                <MetricCard label="Est. Payback" value={fmt.months(calc.paybackMonths)} color="blue"
                  tip="Frame investment ÷ total quantified annual value × 12." />
              )}
            </div>

            {/* Capacity/hard-dollar separation note */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
              <div className="bg-purple-50 border border-purple-100 rounded-lg p-3 text-sm">
                <p className="font-semibold text-purple-900 mb-1">Capacity Impact</p>
                <p className="text-purple-800">{fmt.currency(calc.productiveCapacityValue)}/year</p>
                <p className="text-xs text-purple-600 mt-1">
                  Value of employee time potentially returned to higher-value work.
                  This is not a guarantee of cash savings or headcount reduction.
                </p>
              </div>
              {calc.hardDollarSavings > 0 ? (
                <div className="bg-emerald-50 border border-emerald-100 rounded-lg p-3 text-sm">
                  <p className="font-semibold text-emerald-900 mb-1">Hard-Dollar Impact</p>
                  <p className="text-emerald-800">{fmt.currency(calc.hardDollarSavings)}/year</p>
                  <p className="text-xs text-emerald-600 mt-1">
                    Actual spend that may be eliminated or reduced. Entered by the seller based on customer inputs.
                  </p>
                </div>
              ) : (
                <div className="bg-gray-50 border border-gray-100 rounded-lg p-3 text-sm">
                  <p className="font-semibold text-gray-700 mb-1">Hard-Dollar Impact</p>
                  <p className="text-gray-500">Not quantified</p>
                  <p className="text-xs text-gray-400 mt-1">
                    Enter current storage, tool, or infrastructure spend in Step 3 to surface hard-dollar savings.
                  </p>
                </div>
              )}
            </div>

            {/* Scenario comparison */}
            <div>
              <p className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Scenario Comparison</p>
              <div className="grid grid-cols-3 gap-2">
                {[
                  { id: 'conservative', label: 'Conservative', mult: 0.5 },
                  { id: 'expected',     label: 'Expected',     mult: 1.0 },
                  { id: 'high-impact',  label: 'High-Impact',  mult: 1.5 },
                ].map(sc => {
                  const adjMins = (parseFloat(s.minutesSavedPerWeek) || 0) * sc.mult;
                  const capVal = calc.participants > 0 && calc.hourlyRate > 0
                    ? calc.participants * (adjMins / 60) * calc.hourlyRate * PC.rules.workingWeeksPerYear : 0;
                  const totalVal = capVal + calc.hardDollarSavings;
                  const scRoi = calc.totalInvestment > 0 ? ((totalVal - calc.totalInvestment) / calc.totalInvestment) * 100 : null;
                  const beMin = (!calc.hardDollarsCoverInvestment && calc.participants > 0 && calc.hourlyRate > 0)
                    ? (calc.remainingToJustify / calc.participants / calc.hourlyRate / PC.rules.workingWeeksPerYear) * 60 / sc.mult : null;
                  return (
                    <div key={sc.id}
                      className={`rounded-lg p-3 border text-xs ${s.activeScenario === sc.id ? 'border-[#FA0F00] bg-red-50' : 'border-gray-200 bg-gray-50'}`}>
                      <p className="font-semibold text-gray-700 mb-2">{sc.label}</p>
                      <p className="text-gray-600">Capacity: <span className="font-medium">{fmt.currency(capVal, true)}</span></p>
                      <p className="text-gray-600">Total: <span className="font-medium">{fmt.currency(totalVal, true)}</span></p>
                      <p className="text-gray-600">ROI: <span className={`font-medium ${scRoi != null && scRoi >= 0 ? 'text-emerald-700' : 'text-red-600'}`}>{fmt.pct(scRoi, 0)}</span></p>
                    </div>
                  );
                })}
              </div>
              <p className="text-xs text-gray-400 mt-2">
                Hard-dollar savings ({fmt.currency(calc.hardDollarSavings)}) are unchanged across scenarios.
                Only the productivity estimate scales.
              </p>
            </div>

            {/* Capacity gap */}
            {calc.capacityGapPct != null && calc.capacityGapPct > 0 && (
              <div className="mt-4 bg-amber-50 border border-amber-100 rounded-lg p-4">
                <p className="text-sm font-semibold text-amber-900 mb-1">Capacity Gap</p>
                <p className="text-2xl font-bold text-amber-800 mb-1">+{fmt.num(calc.capacityGapPct)} pp</p>
                <p className="text-sm text-amber-800">
                  Content demand is expected to grow <strong>{fmt.pct(calc.contentGrowthPct)}</strong> while
                  creative headcount grows only <strong>{fmt.pct(calc.headcountGrowthPct)}</strong>.
                  The organization will need significantly more throughput from its existing team.
                  Frame can help reduce coordination overhead and accelerate delivery cycles,
                  though it is not a substitute for headcount.
                </p>
              </div>
            )}
          </Card>

          {/* Section 3: Executive Narrative */}
          <Card>
            <h2 className="text-lg font-bold text-gray-900 mb-3">Executive Narrative</h2>
            <p className="text-xs text-gray-500 mb-3 no-print">
              Paste this into an email, proposal document, or executive readout. Adjust as needed.
            </p>
            <div className="bg-gray-50 rounded-lg p-4 text-sm text-gray-800 leading-relaxed border border-gray-200">
              {narrative || <span className="text-gray-400">Complete Steps 1–3 to generate the narrative.</span>}
            </div>
          </Card>

          {/* Disclaimer */}
          <div className="text-xs text-gray-400 leading-relaxed">
            <strong>Important:</strong> All figures are estimates based on inputs provided and are intended as a starting point for discussion.
            Productive capacity recovered represents the value of time potentially returned to higher-value work and is not a guarantee of cash savings or headcount reduction.
            Hard-dollar savings reflect only spend explicitly identified by the seller. ROI and payback estimates are based on the assumptions entered.
            Actual outcomes depend on adoption, workflow change, and business context.
            Prices shown at {s.priceLevel} pricing; final pricing subject to Deal Desk review.
          </div>

          {/* Assumptions panel */}
          <AssumptionsPanel s={s} u={u} calc={calc} />
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════
    //  NAVIGATION BUTTONS
    // ═══════════════════════════════════════════════════════════════════
    function NavButtons({ step, setStep, calc }) {
      const canNext = () => {
        if (step === 0) return calc.plan && calc.seats >= 10 && calc.errors.length === 0;
        if (step === 1) return true;
        if (step === 2) return calc.participants > 0 && calc.hourlyRate > 0 && calc.adjMinutesSaved > 0;
        return false;
      };
      const labels = ['Continue to Storage →', 'Continue to ROI →', 'Generate Proposal →', ''];
      return (
        <div className="flex justify-between mt-6 pt-4 border-t border-gray-200 no-print">
          <button
            onClick={() => setStep(s => Math.max(0, s - 1))}
            className={`px-5 py-2.5 text-sm font-medium rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50 transition-colors ${step === 0 ? 'invisible' : ''}`}
          >
            ← Back
          </button>
          {step < 3 && (
            <button
              onClick={() => setStep(s => s + 1)}
              disabled={!canNext()}
              className={`px-6 py-2.5 text-sm font-medium rounded-lg transition-colors
                ${canNext()
                  ? 'bg-[#FA0F00] text-white hover:bg-[#d90d00] shadow-sm'
                  : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}
            >
              {labels[step]}
            </button>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════════
    //  APP ROOT
    // ═══════════════════════════════════════════════════════════════════
    function App() {
      const [step, setStep] = useState(0);
      const [s, setState] = useState({
        customerName: '',
        opportunityName: '',
        buyingProgram: '',
        plan: '',
        seats: '',
        priceLevel: 'target',
        // Add-ons
        additionalManagedTB: '0',
        additionalMountedBlocks: '1',
        // Step 2
        activeMediaTB: '',
        annualGrowthPct: '',
        currentStorageSpend: '',
        duplicationFactor: '',
        // Step 3 (participants derives from seats × participantsRatio when blank)
        participants: '',
        participantsRatio: '2',
        activePreset: '',
        hourlyLaborCost: '75',
        minutesSavedPerWeek: '30',
        currentSpendToReduce: '',
        annualProjects: '',
        reviewRoundsPerProject: '',
        hoursDelayPerReview: '',
        contentDemandGrowthPct: '',
        headcountGrowthPct: '',
        // Custom price overrides (leave blank to use table price)
        customPricePerSeat: '',
        customManagedPrice: '',
        customMountedPrice: '',
        // Global
        activeScenario: 'expected',
      });

      const u = useCallback((key, value) => {
        setState(prev => ({ ...prev, [key]: value }));
      }, []);

      const calc = useMemo(() => calculate(s), [s]);

      // Persist to sessionStorage
      useEffect(() => {
        try {
          const saved = sessionStorage.getItem('frame-roi-state');
          if (saved) {
            const parsed = JSON.parse(saved);
            setState(prev => ({ ...prev, ...parsed }));
          }
        } catch {}
      }, []);

      useEffect(() => {
        try {
          sessionStorage.setItem('frame-roi-state', JSON.stringify(s));
        } catch {}
      }, [s]);

      const stepProps = { s, u, calc };

      return (
        <div className="min-h-screen bg-[#f5f5f5]">
          <Header />
          <StepProgress current={step} onGo={newStep => { if (newStep <= step) setStep(newStep); }} />

          <div className="max-w-screen-xl mx-auto px-4 py-6 print-page">
            {/* Layout: form (left) + results sidebar (right) */}
            <div className={`${step < 3 ? 'lg:grid lg:grid-cols-5 lg:gap-6' : ''}`}>
              {/* Main form area */}
              <div className={step < 3 ? 'lg:col-span-3' : ''}>
                {step === 0 && <Step1 {...stepProps} />}
                {step === 1 && <Step2 {...stepProps} />}
                {step === 2 && <Step3 {...stepProps} />}
                {step === 3 && <Step4 {...stepProps} />}
                <NavButtons step={step} setStep={setStep} calc={calc} />
              </div>

              {/* Sticky results sidebar (steps 0–2 only) */}
              {step < 3 && (
                <div className="lg:col-span-2 mt-6 lg:mt-0">
                  <div className="sticky top-6">
                    <ResultsPanel {...stepProps} currentStep={step} />
                    {step > 0 && <AssumptionsPanel {...stepProps} />}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
